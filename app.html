        // ==========================================
        // FUNCIÓN PRINCIPAL: Generar PDF de Boleta Individual
        // ==========================================
        async function exportarBoletaIndividual(estudianteId, nombreEstudiante, mostrarNotificacion = true) {
            try {
                if (mostrarNotificacion) showNotification('📄 Procesando boleta...', 'info');

                // 1. Cargar datos SOLO si no existen en memoria (Optimización clave)
                if (!app.data.institucion) await loadInstitution();
                if (!app.data.grados || app.data.grados.length === 0) await loadGrados();
                if (!app.data.secciones || app.data.secciones.length === 0) await loadSecciones();
                if (!app.data.unidades || app.data.unidades.length === 0) await loadUnidades();

                // Limpiar caché de notas para asegurar datos frescos
                limpiarCachePromedios();

                // 2. Obtener datos del estudiante
                const { data: estudiante } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', estudianteId)
                    .single();

                if (!estudiante) throw new Error("Estudiante no encontrado");

                // 3. Obtener cursos
                const { data: cursosEstudiante } = await supabaseClient
                    .from('estudiante_cursos')
                    .select('*, cursos(id, nombre, codigo, descripcion)')
                    .eq('estudiante_id', estudianteId)
                    .eq('activo', true);

                if (!cursosEstudiante || cursosEstudiante.length === 0) {
                    if (mostrarNotificacion) showNotification('Sin cursos asignados', 'warning');
                    return; // Salimos sin error crítico
                }

                // 4. Generar PDF
                await generarPDFBoleta(estudiante, cursosEstudiante);

                if (mostrarNotificacion) showNotification('✅ Boleta generada', 'success');
                return true; // Retornamos éxito

            } catch (error) {
                console.error('Error PDF:', error);
                if (mostrarNotificacion) showNotification('Error: ' + error.message, 'danger');
                throw error; // Lanzamos el error para que el masivo lo detecte
            }
        }
        // ==========================================
        // FUNCIÓN: Generar PDF de Boleta (DISEÑO ORIGINAL + CORRECCIONES)
        // ==========================================
        async function generarPDFBoleta(estudiante, cursosEstudiante) {
            // 👇 CAMBIA ESTO POR EL NOMBRE DE TU COLEGIO 👇
            const NOMBRE_COLEGIO_FIJO = "COLEGIO EJEMPLO";

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'letter');

            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 15;
            let yPos = margin;

            // 1. LOGO (Original)
            try {
                const imgLogo = await cargarImagen(URL_LOGO_INSTITUCION);
                doc.addImage(imgLogo, 'PNG', margin, 10, 25, 25);
            } catch (e) { }

            // 2. ENCABEZADO (Original)
            doc.setFontSize(18);
            doc.setFont(undefined, 'bold');

            // Lógica: Si hay dato en BD úsalo, sino usa la Variable Fija
            let nombreMostrar = NOMBRE_COLEGIO_FIJO;
            if (app.data.institucion && app.data.institucion.nombre) {
                nombreMostrar = app.data.institucion.nombre;
            }
            doc.text(nombreMostrar, pageWidth / 2, yPos, { align: 'center' });

            doc.setFontSize(14);
            doc.setFont(undefined, 'normal');
            yPos += 8;
            doc.text('BOLETA DE CALIFICACIONES', pageWidth / 2, yPos, { align: 'center' });

            doc.setFontSize(11);
            yPos += 7;
            doc.text('Año Lectivo ' + new Date().getFullYear(), pageWidth / 2, yPos, { align: 'center' });

            doc.setFontSize(9);
            doc.setFont(undefined, 'italic');
            yPos += 5;
            const fechaImp = new Date().toLocaleDateString('es-GT', { day: 'numeric', month: 'long', year: 'numeric' });
            doc.text('Fecha de impresión: ' + fechaImp, pageWidth / 2, yPos, { align: 'center' });

            yPos += 5;
            doc.setDrawColor(66, 133, 244);
            doc.setLineWidth(0.5);
            doc.line(margin, yPos, pageWidth - margin, yPos);

            // 3. DATOS DEL ESTUDIANTE (Original con Grado y Sección)
            const gradoObj = app.data.grados.find(g => g.id === estudiante.grado_id);
            const nombreGrado = gradoObj ? gradoObj.nombre : 'Sin Grado';
            const seccionObj = app.data.secciones.find(s => s.id === estudiante.seccion_id);
            const nombreSeccion = seccionObj ? seccionObj.nombre : 'Unica';

            estudiante.seccion_nombre = seccionObj ? seccionObj.nombre : 'Unica';

            yPos += 8;
            doc.setFontSize(10);
            doc.setFont(undefined, 'bold');
            doc.setTextColor(25, 103, 210);
            doc.text('DATOS DEL ESTUDIANTE', margin + 3, yPos);
            yPos += 2;
            doc.setFillColor(232, 240, 254); // Light blue background
            doc.roundedRect(margin, yPos, pageWidth - (margin * 2), 18, 3, 3, 'F');

            doc.setTextColor(0, 0, 0);
            const lineY = yPos + 6;
            doc.setFont(undefined, 'bold');
            doc.text('Nombre:', margin + 5, lineY);
            doc.text('Código:', margin + 5, lineY + 5);
            doc.text('Email:', margin + 5, lineY + 10);

            doc.text('Grado:', pageWidth / 2 + 10, lineY);
            doc.text('Sección:', pageWidth / 2 + 10, lineY + 5);

            doc.setFont(undefined, 'normal');
            doc.text(estudiante.nombre_completo, margin + 25, lineY);
            doc.text(estudiante.codigo_estudiante || 'N/A', margin + 25, lineY + 5);
            doc.text(estudiante.email || 'N/A', margin + 25, lineY + 10);

            doc.text(nombreGrado, pageWidth / 2 + 30, lineY);
            doc.text(nombreSeccion, pageWidth / 2 + 30, lineY + 5);

            yPos += 22; // Espacio para la tabla

            // 4. TABLA DE CALIFICACIONES (AQUÍ ESTÁ LA OPTIMIZACIÓN)
            const headers = ['CURSO'];
            app.data.unidades.forEach(function (u) {
                headers.push('U' + u.numero);
            });
            headers.push('PROMEDIO');

            const tableData = [];
            let sumaPromedios = 0;
            let cursosConNotas = 0;

            for (const mc of cursosEstudiante) {
                const curso = mc.cursos;
                const cursoNombre = curso.nombre + (curso.codigo ? '\n(' + curso.codigo + ')' : '');
                const row = [cursoNombre];

                for (const unidad of app.data.unidades) {
                    const datos = await obtenerDatosPromedio(estudiante.id, curso.id, unidad.id);
                    // Pasamos el porcentaje real para que didDrawCell lo reconozca
                    const perc = datos.max > 0 ? (datos.puntos / datos.max) * 100 : 0;
                    row.push(datos.max > 0 ? perc : 0);
                }

                const datosCurso = await obtenerDatosPromedio(estudiante.id, curso.id);
                const percCurso = datosCurso.max > 0 ? (datosCurso.puntos / datosCurso.max) * 100 : 0;
                row.push(datosCurso.max > 0 ? percCurso : 0);

                if (datosCurso.max > 0) {
                    sumaPromedios += percCurso;
                    cursosConNotas++;
                }
                tableData.push(row);
            }

            doc.autoTable({
                startY: yPos,
                head: [headers],
                body: tableData,
                theme: 'grid',
                styles: {
                    fontSize: 6.5,
                    cellPadding: 1,
                    minCellHeight: 12, // ✅ Altura más compacta (antes 18.5)
                    halign: 'center',
                    valign: 'middle'
                },
                headStyles: {
                    fillColor: [66, 133, 244],
                    textColor: [255, 255, 255],
                    fontStyle: 'bold',
                    fontSize: 7,
                    minCellHeight: 7 // ✅ Encabezado con altura mínima
                },
                columnStyles: {
                    0: { halign: 'left', cellWidth: 50 }
                },
                didParseCell: function (data) {
                    if (data.section === 'body' && data.column.index > 0) {
                        const valor = parseFloat(data.cell.raw);
                        const cursoObj = cursosEstudiante[data.row.index].cursos;
                        const isIconMode = cursoObj.descripcion && cursoObj.descripcion.includes('[ICONOS]');

                        if (valor > 0) {
                            if (isIconMode) {
                                const info = getGradingInfo(valor);
                                data.cell.text = [info.label]; // Ponemos solo el texto para el PDF
                            } else {
                                data.cell.text = [valor.toFixed(2)];
                            }
                        } else {
                            data.cell.text = ['-'];
                        }
                    }
                },
                didDrawCell: function (data) {
                    if (data.section !== 'body' || data.column.index === 0) return;

                    const valor = parseFloat(data.cell.raw);
                    if (isNaN(valor) || valor <= 0) return;

                    const isAverageCol = data.column.index === headers.length - 1;
                    const cursoObj = cursosEstudiante[data.row.index].cursos;
                    const isIconMode = cursoObj.descripcion && cursoObj.descripcion.includes('[ICONOS]');
                    const info = getGradingInfo(valor);

                    // 1. COLORES (Sincronizados EXACTAMENTE con la Web y getGradingInfo)
                    let fillColor, textColor = [0, 0, 0];
                    if (isAverageCol) {
                        // Colores Vibrantes (Promedio)
                        if (valor >= 90) fillColor = [251, 188, 4]; // Amarillo/Oro
                        else if (valor >= 80) fillColor = [52, 168, 83]; // Verde
                        else if (valor >= 70) fillColor = [66, 133, 244]; // Azul
                        else if (valor >= 60) fillColor = [255, 167, 38]; // Naranja
                        else fillColor = [234, 67, 53]; // Rojo
                        textColor = [255, 255, 255];
                    } else {
                        // Colores Pastel (Unidades)
                        if (valor >= 90) fillColor = [254, 247, 224];
                        else if (valor >= 80) fillColor = [230, 244, 234];
                        else if (valor >= 70) fillColor = [232, 240, 254];
                        else if (valor >= 60) fillColor = [255, 243, 205];
                        else fillColor = [252, 232, 230];
                    }

                    // 2. FONDO
                    doc.setFillColor(fillColor[0], fillColor[1], fillColor[2]);
                    doc.rect(data.cell.x, data.cell.y, data.cell.width, data.cell.height, 'F');

                    if (isIconMode) {
                        // 3. ICONO (Refinamiento final para evitar desbordamiento)
                        try {
                            const imgSize = 2.8;
                            const x = data.cell.x + (data.cell.width / 2) - (imgSize / 2);
                            doc.addImage(emojiToDataURL(info.faceIcon), 'PNG', x, data.cell.y + 0.4, imgSize, imgSize);
                        } catch (e) { }

                        // 4. ESTRELLAS (Más compactas)
                        try {
                            const starSize = 1.5;
                            const starCount = (info.simpleStars.match(/⭐/g) || []).length;
                            const totalStarsWidth = starCount * starSize;
                            let xStar = data.cell.x + (data.cell.width / 2) - (totalStarsWidth / 2);
                            const starImg = emojiToDataURL('⭐');
                            for (let i = 0; i < starCount; i++) {
                                doc.addImage(starImg, 'PNG', xStar + (i * starSize), data.cell.y + 3.0, starSize, starSize);
                            }
                        } catch (e) { }
                    }

                    // 5. TEXTO (Reposicionado hacia arriba para mayor espacio inferior)
                    doc.setTextColor(textColor[0], textColor[1], textColor[2]);
                    doc.setFont(undefined, isAverageCol ? 'bold' : 'normal');
                    const txt = isIconMode ? info.label : valor.toFixed(2);

                    // Si es Iconos: Empujamos el texto hacia arriba (7.2) para evitar corte inferior
                    // Si es Numérico: Centrado vertical absoluto.
                    const yTxt = isIconMode ? data.cell.y + 7.2 : data.cell.y + (data.cell.height / 2);
                    const baseline = 'middle';

                    doc.text(txt, data.cell.x + data.cell.width / 2, yTxt, {
                        align: 'center', baseline: baseline, maxWidth: data.cell.width - 2
                    });
                }
            });

            // 5. PROMEDIO GENERAL (Original: Centrado)
            yPos = doc.lastAutoTable.finalY + 10;

            const promedioGeneral = cursosConNotas > 0 ? (sumaPromedios / cursosConNotas).toFixed(2) : '0.00';
            const aprobado = parseFloat(promedioGeneral) >= 60;
            const promNum = parseFloat(promedioGeneral);
            let boxColor;

            const boxWidth = 80;
            const boxHeight = 22; // Más compacto
            const boxX = (pageWidth - boxWidth) / 2;

            if (promNum >= 90) boxColor = [251, 188, 4]; // Oro
            else if (promNum >= 80) boxColor = [52, 168, 83]; // Verde
            else if (promNum >= 70) boxColor = [66, 133, 244]; // Azul
            else if (promNum >= 60) boxColor = [255, 167, 38]; // Naranja
            else boxColor = [234, 67, 53]; // Rojo

            doc.setFillColor(boxColor[0], boxColor[1], boxColor[2]);
            doc.roundedRect(boxX, yPos, boxWidth, boxHeight, 3, 3, 'F');

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(8); // Era 10
            doc.setFont(undefined, 'bold');
            doc.text('PROMEDIO GENERAL DEL AÑO', pageWidth / 2, yPos + 6, { align: 'center' });

            doc.setFontSize(18); // Era 24
            doc.text(promedioGeneral, pageWidth / 2, yPos + 13, { align: 'center' });

            doc.setFontSize(9); // Era 12
            const estadoTexto = aprobado ? '✓ PROMOVIDO' : '✗ NO PROMOVIDO';
            doc.text(estadoTexto, pageWidth / 2, yPos + 19, { align: 'center' });

            // 6. ESCALA DE CALIFICACIONES (Original)
            yPos += 40;
            if (yPos + 35 > pageHeight - margin) {
                doc.addPage();
                yPos = margin;
            }

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(10);
            doc.setFont(undefined, 'bold');
            doc.text('ESCALA DE CALIFICACIONES', margin, yPos);

            yPos += 2;
            const escalaData = [
                ['90 - 100', 'Excelente'],
                ['70 - 89', 'Muy Bueno'],
                ['60 - 69', 'Reprobado Institucional'],
                ['0 - 59', 'Reprobado Mineduc']
            ];

            doc.autoTable({
                startY: yPos + 3,
                head: [['Rango', 'Calificación']],
                body: escalaData,
                theme: 'grid',
                styles: { fontSize: 8, cellPadding: 2, halign: 'center' }, // ✅ Revertido a versión más legible
                headStyles: { fillColor: [100, 100, 100], textColor: [255, 255, 255] },
                columnStyles: { 0: { cellWidth: 35 }, 1: { cellWidth: 55 } },
                margin: { left: margin }
            });

            // 7. FIRMAS (Original: 3 Firmas)
            yPos = doc.lastAutoTable.finalY + 20;
            if (yPos + 25 > pageHeight - margin) {
                doc.addPage();
                yPos = margin + 20;
            }

            const firmaWidth = 60;
            const firmaSpacing = (pageWidth - (margin * 2) - (firmaWidth * 3)) / 2;

            doc.setFont(undefined, 'normal');
            doc.setFontSize(9);

            const firmaY = yPos;

            doc.line(margin, firmaY, margin + firmaWidth, firmaY);
            doc.text('Director(a)', margin + (firmaWidth / 2), firmaY + 5, { align: 'center' });

            const firma2X = margin + firmaWidth + firmaSpacing;
            doc.line(firma2X, firmaY, firma2X + firmaWidth, firmaY);
            doc.text('Maestro(a) Guía', firma2X + (firmaWidth / 2), firmaY + 5, { align: 'center' });

            const firma3X = firma2X + firmaWidth + firmaSpacing;
            doc.line(firma3X, firmaY, firma3X + firmaWidth, firmaY);
            doc.text('Padre/Madre/Tutor', firma3X + (firmaWidth / 2), firmaY + 5, { align: 'center' });

            // 8. PIE DE PÁGINA (Original)
            doc.setFontSize(8);
            doc.setFont(undefined, 'italic');
            doc.setTextColor(100, 100, 100);
            doc.text(
                'Documento generado automáticamente por el Sistema ' + nombreMostrar,
                pageWidth / 2,
                pageHeight - 10,
                { align: 'center' }
            );

            // Guardar PDF
            const nombreArchivo = 'Boleta_' + (estudiante.codigo_estudiante || estudiante.id) + '_' + new Date().getFullYear() + '.pdf';
            doc.save(nombreArchivo);
        }

                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('No se pudo cargar la imagen'));
                img.src = url;
            });
        }

        // ==========================================
        // EXPORTACIÓN MASIVA DE BOLETAS
        // ==========================================
        async function exportarBoletasSeleccionadas() {
            // Obtener checkboxes marcados
            const seleccionados = document.querySelectorAll('.check-estudiante:checked');

            if (seleccionados.length === 0) {
                showNotification('⚠️ No hay estudiantes seleccionados.', 'warning');
                return;
            }

            if (!confirm(`Se generarán ${seleccionados.length} archivos PDF.\n\n¿Deseas continuar?`)) {
                return;
            }

            const btn = document.getElementById('btnExportarMasivo');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ Iniciando...';
            }

            // Optimización: Cargar datos globales
            await loadInstitution();
            await loadUnidades();

            let contador = 0;

            // Convertir NodeList a Array para poder iterar tranquilamente
            const listaCheckboxes = Array.from(seleccionados);

            for (const checkbox of listaCheckboxes) {
                const id = checkbox.dataset.estudianteId;
                const nombre = checkbox.dataset.estudianteNombre;

                try {
                    if (btn) btn.textContent = `⏳ Procesando ${contador + 1} de ${listaCheckboxes.length}...`;

                    // false = sin notificación flotante individual
                    await exportarBoletaIndividual(id, nombre, false);
                    contador++;

                    // PAUSA OBLIGATORIA (1 segundo)
                    await new Promise(r => setTimeout(r, 1000));

                } catch (error) {
                    console.error(`Error con ${nombre}:`, error);
                }
            }

            if (btn) {
                btn.disabled = false;
                btn.textContent = '📄 Exportar Seleccionadas';
            }

            showNotification(`✅ Proceso finalizado. ${contador} boletas descargadas.`, 'success');
        }

            await loadUnidades();

            showNotification(`✅ Exportación completada. ${contador} boletas descargadas.`, 'success');

        // ── Carga mensajes recibidos ──────────────────────────────────────

                    .from('mensajes')

            } catch (e) {
                console.error('❌ Error cargando mensajes:', e);

                app.data.mensajesNoLeidos = 0;

        }

        // ── Marca un mensaje como leído ───────────────────────────────────
        async function markMensajeAsRead(mensajeId) {
            try {
                await supabaseClient
                    .from('mensajes')
                    .update({ leido: true })
                    .eq('id', mensajeId);
                // Actualizar localmente
                const m = app.data.mensajes.find(x => x.id === mensajeId);
                if (m && !m.leido) {
                    m.leido = true;
                    app.data.mensajesNoLeidos = Math.max(0, app.data.mensajesNoLeidos - 1);

        // ── Obtiene destinatarios disponibles según el rol ────────────────
        async function getDestinatariosDisponibles() {
            const rol = app.currentUser.rol;
            const miId = app.currentUser.id;
            try {
                if (rol === 'admin') {
                    // Admin puede escribir a todos
                    const { data } = await supabaseClient
                        .from('profiles')
                        .select('id, nombre_completo, rol')
                        .neq('id', miId)
                        .order('nombre_completo');
                    return data || [];
                }

                if (rol === 'coordinador') {
                    // Coordinador: admins, coordinadores, maestros
                    const { data } = await supabaseClient
                        .from('profiles')
                        .select('id, nombre_completo, rol')
                        .in('rol', ['admin', 'coordinador', 'maestro'])
                        .neq('id', miId)
                        .order('nombre_completo');
                    return data || [];
                }

                if (rol === 'maestro') {
                    // Maestro: admins, coordinadores, otros maestros, sus propios estudiantes inscritos
                    const [{ data: staff }, { data: asigs }] = await Promise.all([
                        supabaseClient
                            .from('profiles')
                            .select('id, nombre_completo, rol')
                            .in('rol', ['admin', 'coordinador', 'maestro'])
                            .neq('id', miId),
                        supabaseClient
                            .from('curso_asignaciones')
                            .select('curso_id')
                            .eq('maestro_id', miId)
                            .eq('activo', true)
                    ]);
                    const cursoIds = (asigs || []).map(a => a.curso_id);
                    let estudiantes = [];
                    if (cursoIds.length > 0) {
                        const { data: inscritos } = await supabaseClient
                            .from('estudiante_cursos')
                            .select('estudiante_id')
                            .in('curso_id', cursoIds)
                            .eq('activo', true);
                        const estudianteIds = [...new Set((inscritos || []).map(i => i.estudiante_id))];
                        if (estudianteIds.length > 0) {
                            const { data: perfs } = await supabaseClient
                                .from('profiles')
                                .select('id, nombre_completo, rol')
                                .in('id', estudianteIds);
                            estudiantes = perfs || [];
                        }
                    }
                    return [...(staff || []), ...estudiantes];
                }

                if (rol === 'estudiante') {
                    // Estudiante: solo maestros de sus cursos inscritos
                    const { data: inscrip } = await supabaseClient
                        .from('estudiante_cursos')
                        .select('curso_id')
                        .eq('estudiante_id', miId)
                        .eq('activo', true);
                    const cursoIds = (inscrip || []).map(i => i.curso_id);
                    if (cursoIds.length === 0) return [];
                    const { data: asigs } = await supabaseClient
                        .from('curso_asignaciones')
                        .select('maestro_id')
                        .in('curso_id', cursoIds)
                        .eq('activo', true);
                    const maestroIds = [...new Set((asigs || []).map(a => a.maestro_id))];
                    if (maestroIds.length === 0) return [];
                    const { data: perfs } = await supabaseClient
                        .from('profiles')
                        .select('id, nombre_completo, rol')
                        .in('id', maestroIds);
                    return perfs || [];
                }

                return [];
            } catch (e) {
                console.error('❌ Error cargando destinatarios:', e);
                return [];
            }
        }

        // ── Helpers de formato ────────────────────────────────────────────
        function formatMsgFecha(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const hoy = new Date();
            const mismoDia = d.toDateString() === hoy.toDateString();
            if (mismoDia) {
                return d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
            }
            return d.toLocaleDateString('es', { day: '2-digit', month: 'short' });
        }

        function formatMsgFechaLarga(ts) {
            if (!ts) return '';
            return new Date(ts).toLocaleString('es', {
                day: '2-digit', month: 'long', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // ── Resuelve nombre de un usuario_id ─────────────────────────────
        const _perfilCache = {};
        async function getNombrePerfil(id) {
            if (!id) return 'Desconocido';
            if (_perfilCache[id]) return _perfilCache[id];
            const { data } = await supabaseClient
                .from('profiles')
                .select('nombre_completo')
                .eq('id', id)
                .maybeSingle();
            const nombre = data ? (data.nombre_completo || '').trim() || 'Desconocido' : 'Desconocido';
            _perfilCache[id] = nombre;
            return nombre;
        }

        // ── Renderiza la bandeja (lista izquierda) ────────────────────────
        function renderBandejaLista(lista, tipo) {
            if (lista.length === 0) {
                return `<div style="padding:2rem; text-align:center; color:var(--text-secondary);">
                    📭 No hay mensajes ${tipo === 'recibidos' ? 'recibidos' : 'enviados'}
                </div>`;
            }
            return lista.map(m => {
                const noLeido = tipo === 'recibidos' && !m.leido;
                const activo = mensajeriaState.mensajeActivo === m.id;
                const persona = tipo === 'recibidos'
                    ? (m._de_nombre || '...')
                    : (m._para_nombre || '...');
                return `
                    <div class="mensajes-item ${noLeido ? 'no-leido' : ''} ${activo ? 'activo' : ''}"
                         onclick="seleccionarMensaje('${m.id}', '${tipo}')">
                        <div style="display:flex; align-items:center; gap:4px;">
                            ${noLeido ? '<span class="msg-punto-nuevo"></span>' : ''}
                            <span class="msg-item-remitente">${persona}</span>
                            <span class="msg-item-fecha" style="margin-left:auto;">${formatMsgFecha(m.created_at)}</span>
                        </div>
                        <div class="msg-item-asunto">${m.asunto || '(Sin asunto)'}</div>
                    </div>`;
            }).join('');
        }

        // ── Renderiza el detalle del mensaje seleccionado ─────────────────
        function renderMensajeDetalle(mensajeId, tipo) {
            const lista = tipo === 'recibidos' ? app.data.mensajes : app.data.mensajesEnviados;
            const m = lista.find(x => x.id === mensajeId);
            if (!m) {
                return '<div class="mensajes-detalle-vacio"><span>📭</span>Selecciona un mensaje para leerlo</div>';
            }
            const deNombre = m._de_nombre || '';
            const paraNombre = m._para_nombre || '';
            const esRecibido = tipo === 'recibidos';
            const asuntoSeguro = (m.asunto || '').replace(/"/g, '&quot;');
            const deIdSeguro = m.de_usuario_id || '';
            return `
                <div class="msg-detalle-header">
                    <div class="msg-detalle-asunto">${m.asunto || '(Sin asunto)'}</div>
                    <div class="msg-detalle-meta">
                        <span>✉️ <strong>De:</strong> ${deNombre || 'Tú'}</span>
                        <span>➡️ <strong>Para:</strong> ${paraNombre || 'Tú'}</span>
                        <span>🕐 ${formatMsgFechaLarga(m.created_at)}</span>
                        ${esRecibido ? `<span>${m.leido ? '✅ Leído' : '🔵 Nuevo'}</span>` : ''}
                    </div>
                </div>
                <div class="msg-detalle-cuerpo">${m.mensaje || ''}</div>
                <div class="msg-detalle-acciones">
                    ${esRecibido ? `
                        <button class="btn btn-primary btn-sm"
                            data-de-id="${deIdSeguro}"
                            data-asunto="${asuntoSeguro}"
                            onclick="openResponderMensajeModal(this.dataset.deId, this.dataset.asunto)">
                            ↩️ Responder
                        </button>
                    ` : ''}
                </div>`;
        }

        // ── Render principal de la vista mensajes ─────────────────────────
        async function renderMensajes() {
            // Cargar ambas bandejas en paralelo
            await Promise.all([loadMensajes(), loadMensajesEnviados()]);

            const lista = mensajeriaState.bandeja === 'recibidos'
                ? app.data.mensajes
                : app.data.mensajesEnviados;

            // Resolver nombres en paralelo
            await Promise.all(lista.map(async m => {
                m._de_nombre = await getNombrePerfil(m.de_usuario_id);
                m._para_nombre = await getNombrePerfil(m.para_usuario_id);
            }));

            const bandejaHtml = renderBandejaLista(lista, mensajeriaState.bandeja);
            const detalleHtml = mensajeriaState.mensajeActivo
                ? renderMensajeDetalle(mensajeriaState.mensajeActivo, mensajeriaState.bandeja)
                : `<div class="mensajes-detalle-vacio"><span>📩</span>Selecciona un mensaje para leerlo</div>`;

            const noLeidos = app.data.mensajesNoLeidos;

            return `
                <div class="card">
                    <div class="card-header">
                        <span>📬 Mensajes ${noLeidos > 0 ? `<span class="badge badge-danger" style="font-size:0.8rem;margin-left:0.5rem;">${noLeidos} nuevo${noLeidos > 1 ? 's' : ''}</span>` : ''}</span>
                        <button class="btn btn-primary btn-sm" id="btnNuevoMensaje" onclick="openNuevoMensajeModal()">
                            ✉️ Nuevo Mensaje
                        </button>
                    </div>
                </div>

                <div class="mensajes-layout">
                    <!-- Panel izquierdo: lista -->
                    <div class="mensajes-panel">
                        <div class="mensajes-panel-header">
                            <button class="mensajes-tab ${mensajeriaState.bandeja === 'recibidos' ? 'active' : ''}"
                                    onclick="cambiarBandeja('recibidos')">
                                📥 Recibidos ${noLeidos > 0 ? `(${noLeidos})` : ''}
                            </button>
                            <button class="mensajes-tab ${mensajeriaState.bandeja === 'enviados' ? 'active' : ''}"
                                    onclick="cambiarBandeja('enviados')">
                                📤 Enviados
                            </button>
                        </div>
                        <div class="mensajes-list" id="mensajesListaContainer">
                            ${bandejaHtml}
                        </div>
                    </div>

                    <!-- Panel derecho: detalle -->
                    <div class="mensajes-detalle" id="mensajeDetalleContainer">
                        ${detalleHtml}
                    </div>
                </div>`;
        }

        // ── Cambia entre Recibidos / Enviados ─────────────────────────────
        function cambiarBandeja(tipo) {
            mensajeriaState.bandeja = tipo;
            mensajeriaState.mensajeActivo = null;
            renderView('mensajes');
        }

        // ── Selecciona y muestra un mensaje ───────────────────────────────
        async function seleccionarMensaje(mensajeId, tipo) {
            mensajeriaState.mensajeActivo = mensajeId;

            // Marcar como leído si es recibido y no estaba leído
            if (tipo === 'recibidos') {
                const m = app.data.mensajes.find(x => x.id === mensajeId);
                if (m && !m.leido) {
                    await markMensajeAsRead(mensajeId);
                }
            }

            // Actualizar lista y detalle sin recargar toda la vista
            const lista = tipo === 'recibidos' ? app.data.mensajes : app.data.mensajesEnviados;
            const listaContainer = document.getElementById('mensajesListaContainer');
            const detalleContainer = document.getElementById('mensajeDetalleContainer');

            if (listaContainer) listaContainer.innerHTML = renderBandejaLista(lista, tipo);
            if (detalleContainer) detalleContainer.innerHTML = renderMensajeDetalle(mensajeId, tipo);
        }

        // ── Modal: Nuevo Mensaje ──────────────────────────────────────────
        async function openNuevoMensajeModal(para_id_inicial = null, asunto_inicial = '') {
            const destinatarios = await getDestinatariosDisponibles();

            if (destinatarios.length === 0) {
                showNotification('⚠️ No tienes destinatarios disponibles para enviar mensajes.', 'warning');
                return;
            }

            const rolLabel = { admin: 'Administrador', coordinador: 'Coordinador', maestro: 'Maestro', estudiante: 'Estudiante' };
            const opcionesDestinatario = destinatarios.map(p =>
                `<option value="${p.id}" ${p.id === para_id_inicial ? 'selected' : ''}>
                    ${(p.nombre_completo || '').trim()} — ${rolLabel[p.rol] || p.rol}
                </option>`
            ).join('');

            const modal = openModal(`
                <div class="modal-header">
                    <h2>✉️ Nuevo Mensaje</h2>
                    <button class="close-modal" onclick="this.closest('.modal').remove()">×</button>
                </div>
                <div class="nuevo-msg-form" id="nuevoMsgForm">
                    <div class="form-group">
                        <label class="form-label">Para:</label>
                        <select class="form-select" id="msgPara">
                            <option value="">— Selecciona un destinatario —</option>
                            ${opcionesDestinatario}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Asunto:</label>
                        <input type="text" class="form-input" id="msgAsunto"
                               placeholder="Asunto del mensaje"
                               value="${asunto_inicial}" maxlength="120">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mensaje:</label>
                        <textarea class="form-textarea" id="msgCuerpo"
                                  placeholder="Escribe tu mensaje aquí..." rows="6"
                                  style="min-height:150px;"></textarea>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="btnEnviarMsg" onclick="enviarNuevoMensaje()">
                            📨 Enviar Mensaje
                        </button>
                        <button class="btn btn-secondary" onclick="this.closest('.modal').remove()">
                            Cancelar
                        </button>
                    </div>
                </div>
            `);
        }

        // ── Envía el mensaje del modal ────────────────────────────────────
        async function enviarNuevoMensaje() {
            const para = document.getElementById('msgPara')?.value;
            const asunto = document.getElementById('msgAsunto')?.value?.trim();
            const cuerpo = document.getElementById('msgCuerpo')?.value?.trim();

            if (!para) { showNotification('⚠️ Selecciona un destinatario.', 'warning'); return; }
            if (!asunto) { showNotification('⚠️ Escribe un asunto.', 'warning'); return; }
            if (!cuerpo) { showNotification('⚠️ El mensaje no puede estar vacío.', 'warning'); return; }

            const btn = document.getElementById('btnEnviarMsg');
            if (btn) { btn.disabled = true; btn.textContent = '⏳ Enviando...'; }

            try {
                await sendMensaje(para, asunto, cuerpo);
                document.querySelector('.modal')?.remove();
                showNotification('✅ Mensaje enviado correctamente.', 'success');
                // Refrescar vista en bandeja enviados
                mensajeriaState.bandeja = 'enviados';
                mensajeriaState.mensajeActivo = null;
                await renderView('mensajes');
            } catch (e) {
                console.error('❌ Error enviando mensaje:', e);
                showNotification('❌ Error al enviar el mensaje. Inténtalo de nuevo.', 'danger');
                if (btn) { btn.disabled = false; btn.textContent = '📨 Enviar Mensaje'; }
            }
        }

        // ── Modal: Responder mensaje ──────────────────────────────────────
        function openResponderMensajeModal(para_id, asunto_original) {
            const asuntoRespuesta = asunto_original.startsWith('Re: ')
                ? asunto_original
                : `Re: ${asunto_original}`;
            openNuevoMensajeModal(para_id, asuntoRespuesta);
        }

        // ── Polling de no leídos (cada 30 seg) ───────────────────────────
        async function updateMensajesNoLeidos() {
            if (!app.currentUser) return;
            try {
                const { count } = await supabaseClient
                    .from('mensajes')
                    .select('id', { count: 'exact', head: true })
                    .eq('para_usuario_id', app.currentUser.id)
                    .eq('leido', false);
                const anterior = app.data.mensajesNoLeidos;
                app.data.mensajesNoLeidos = count || 0;
                // Solo re-renderizar sidebar si el badge cambió
                if (anterior !== app.data.mensajesNoLeidos) {
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar) sidebar.outerHTML = renderSidebar();
                }
            } catch (e) {
                // Silencioso — no interrumpir la experiencia
            }
        }

        // Iniciar polling cuando el usuario ya inició sesión
        // (Se llama desde la función init() existente después del login)
        function iniciarPollingMensajes() {
            updateMensajesNoLeidos(); // Primera carga inmediata
            setInterval(updateMensajesNoLeidos, 30000); // Cada 30 segundos
        }

    </script>
</body>

</html>
