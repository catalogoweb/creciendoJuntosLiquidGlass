        async function ejecutarExportarBackup() {
            const selectAsig = document.getElementById('backupAsignacion');
            const selectUni = document.getElementById('backupUnidad');

            if (!selectAsig || !selectAsig.value) {
                showNotification('Por favor, selecciona un curso y sección.', 'warning');
                return;
            }
            if (!selectUni || !selectUni.value) {
                showNotification('Por favor, selecciona una unidad.', 'warning');
                return;
            }

            const [cursoId, gradoId, seccionId, cursoNombre, gradoNombre, seccionNombre] = selectAsig.value.split('|');
            const [unidadId, unidadNumero] = selectUni.value.split('|');

            showNotification('Generando archivo de backup...', 'info');

            try {
                // 1. Obtener estudiantes inscritos en esta sección
                const { data: estudiantesCurso, error: estError } = await supabaseClient
                    .from('estudiante_cursos')
                    .select('estudiante_id, profiles!inner (id, nombre_completo, codigo_estudiante)')
                    .eq('curso_id', cursoId)
                    .eq('seccion_id', seccionId)
                    .eq('activo', true)
                    .order('id', { ascending: true });

                if (estError) throw estError;

                if (!estudiantesCurso || estudiantesCurso.length === 0) {
                    showNotification('No hay estudiantes inscritos en este curso y sección.', 'warning');
                    return;
                }

                // 2. Obtener actividades de esta unidad
                const { data: actividades, error: actError } = await supabaseClient
                    .from('actividades')
                    .select('*')
                    .eq('curso_id', cursoId)
                    .eq('grado_id', gradoId)
                    .eq('seccion_id', seccionId)
                    .eq('unidad_id', unidadId);

                if (actError) throw actError;

                if (!actividades || actividades.length === 0) {
                    showNotification('No hay actividades planificadas para esta unidad.', 'warning');
                    return;
                }

                const actividadIds = actividades.map(a => a.id);

                // 3. Obtener notas
                const { data: todasNotas, error: notasError } = await supabaseClient
                    .from('notas')
                    .select('*')
                    .in('actividad_id', actividadIds);

                if (notasError) throw notasError;

                // Mapear notas
                const notasMap = {};
                todasNotas?.forEach(n => {
                    notasMap[`${n.estudiante_id}_${n.actividad_id}`] = n.nota;
                });

                // 4. Estructurar metadatos de configuración
                const configData = {
                    'Tipo_Backup': 'VeyaSchool_Notas_Unidad',
                    'Curso_ID': cursoId,
                    'Curso_Nombre': cursoNombre,
                    'Grado_ID': gradoId,
                    'Grado_Nombre': gradoNombre,
                    'Seccion_ID': seccionId,
                    'Seccion_Nombre': seccionNombre,
                    'Unidad_ID': unidadId,
                    'Unidad_Numero': unidadNumero,
                    'Fecha_Generacion': new Date().toISOString(),
                    'Exportado_Por': app.currentUser.nombre_completo
                };

                // 5. Preparar hoja de Calificaciones
                const headers = ['ID Estudiante', 'Código Estudiante', 'Nombre Estudiante'];
                actividades.forEach(a => {
                    headers.push(`${a.id} | ${a.titulo} (Max ${a.puntaje_maximo} pts)`);
                });
                headers.push('Promedio');

                const rowsData = estudiantesCurso.map(ec => {
                    const est = ec.profiles;
                    const row = [est.id, est.codigo_estudiante || '', est.nombre_completo];

                    let sumaPuntosNetos = 0;
                    let sumaMaximos = 0;

                    actividades.forEach(a => {
                        const key = `${est.id}_${a.id}`;
                        const notaVal = notasMap[key];

                        if (notaVal !== undefined && notaVal !== null && notaVal !== '') {
                            row.push(notaVal);
                            sumaPuntosNetos += (parseFloat(notaVal) / 100) * a.puntaje_maximo;
                            sumaMaximos += a.puntaje_maximo;
                        } else {
                            row.push('');
                        }
                    });

                    const promedio = sumaMaximos > 0 ? ((sumaPuntosNetos / sumaMaximos) * 100).toFixed(2) : '0.00';
                    row.push(promedio);

                    return row;
                });

                // 6. Construir libro Excel
                const wb = XLSX.utils.book_new();

                // Hoja 1: Calificaciones (se agrega primero para que Excel la muestre por defecto al abrir)
                const wsCalificaciones = XLSX.utils.aoa_to_sheet([headers, ...rowsData]);

                // Ajustar anchos de columnas
                wsCalificaciones['!cols'] = [
                    { wch: 38 }, // ID Estudiante
                    { wch: 18 }, // Código Estudiante
                    { wch: 30 }  // Nombre Estudiante
                ];
                actividades.forEach(() => {
                    wsCalificaciones['!cols'].push({ wch: 22 });
                });
                wsCalificaciones['!cols'].push({ wch: 12 }); // Promedio

                XLSX.utils.book_append_sheet(wb, wsCalificaciones, 'Calificaciones');

                // Hoja 2: Configuración (se agrega de segunda para guardar metadatos de validación)
                const configAOA = Object.entries(configData);
                const wsConfig = XLSX.utils.aoa_to_sheet([['Parámetro', 'Valor'], ...configAOA]);
                XLSX.utils.book_append_sheet(wb, wsConfig, 'Config_Backup');

                // Descargar archivo Excel
                const cleanCurso = cursoNombre.replace(/[^a-zA-Z0-9]/g, '_');
                const cleanSec = seccionNombre.replace(/[^a-zA-Z0-9]/g, '_');
                const fechaStr = new Date().toISOString().split('T')[0];
                const fileName = `BackupNotas_${cleanCurso}_Sec_${cleanSec}_U${unidadNumero}_${fechaStr}.xlsx`;

                XLSX.writeFile(wb, fileName);
                showNotification('📥 Backup generado y descargado correctamente.', 'success');
            } catch (err) {
                console.error(err);
                showNotification('Error al exportar backup: ' + err.message, 'danger');
            }
        }

        async function procesarArchivoBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const progress = document.getElementById('backupImportProgress');
            const resultsDiv = document.getElementById('backupImportResults');

            if (progress) progress.classList.remove('hidden');
            if (resultsDiv) {
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
            }

            try {
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });

                // 1. Leer y validar Config_Backup
                const configSheet = workbook.Sheets['Config_Backup'];
                if (!configSheet) {
                    throw new Error('El archivo no parece ser un backup válido (Falta la pestaña Config_Backup).');
                }

                const configJson = XLSX.utils.sheet_to_json(configSheet);
                const config = {};
                configJson.forEach(row => {
                    config[row['Parámetro']] = row['Valor'];
                });

                if (config['Tipo_Backup'] !== 'VeyaSchool_Notas_Unidad') {
                    throw new Error('El archivo no es un Backup de Calificaciones válido de VeyaSchool.');
                }

                const fileCursoId = config['Curso_ID'];
                const fileCursoNombre = config['Curso_Nombre'];
                const fileSeccionId = config['Seccion_ID'];
                const fileSeccionNombre = config['Seccion_Nombre'];
                const fileUnidadId = config['Unidad_ID'];
                const fileUnidadNumero = config['Unidad_Numero'];

                // Validar contra selectores
                const selectAsig = document.getElementById('backupAsignacion');
                const selectUni = document.getElementById('backupUnidad');

                if (!selectAsig || !selectAsig.value) {
                    throw new Error('Por favor, selecciona en la interfaz el Curso y Sección correspondientes antes de importar.');
                }
                if (!selectUni || !selectUni.value) {
                    throw new Error('Por favor, selecciona en la interfaz la Unidad correspondiente antes de importar.');
                }

                const [selCursoId, selGradoId, selSeccionId, selCursoNombre, selGradoNombre, selSeccionNombre] = selectAsig.value.split('|');
                const [selUnidadId, selUnidadNumero] = selectUni.value.split('|');

                if (fileCursoId !== selCursoId || fileSeccionId !== selSeccionId) {
                    if (!confirm(`⚠️ ALERTA DE COINCIDENCIA:\nEl archivo contiene notas para "${fileCursoNombre}" (Sección ${fileSeccionNombre}), pero has seleccionado "${selCursoNombre}" (Sección ${selSeccionNombre}).\n\n¿Estás seguro de que deseas continuar e importar estas notas en el curso seleccionado?`)) {
                        if (progress) progress.classList.add('hidden');
                        return;
                    }
                }

                if (fileUnidadId !== selUnidadId) {
                    if (!confirm(`⚠️ ALERTA DE UNIDAD:\nEl archivo corresponde a la Unidad ${fileUnidadNumero}, pero has seleccionado la Unidad ${selUnidadNumero}.\n\n¿Deseas continuar e importar las notas en la Unidad ${selUnidadNumero}?`)) {
                        if (progress) progress.classList.add('hidden');
                        return;
                    }
                }

                // 2. Leer Calificaciones
                const califSheet = workbook.Sheets['Calificaciones'];
                if (!califSheet) {
                    throw new Error('No se encontró la pestaña "Calificaciones" en el archivo de backup.');
                }

                const califRows = XLSX.utils.sheet_to_json(califSheet, { header: 1 });
                if (califRows.length < 2) {
                    throw new Error('La pestaña "Calificaciones" no tiene datos válidos.');
                }

                const headers = califRows[0];
                const dataRows = califRows.slice(1);

                const idEstudianteIdx = headers.indexOf('ID Estudiante');
                const nombreEstudianteIdx = headers.indexOf('Nombre Estudiante');

                if (idEstudianteIdx === -1) {
                    throw new Error('No se encontró la columna "ID Estudiante" en el archivo.');
                }

                // Obtener columnas de actividades
                const actividadCols = [];
                headers.forEach((h, idx) => {
                    if (idx > nombreEstudianteIdx && h !== 'Promedio') {
                        const parts = h.split('|');
                        if (parts.length > 0) {
                            actividadCols.push({
                                index: idx,
                                id: parts[0].trim(),
                                fullHeader: h
                            });
                        }
                    }
                });

                if (actividadCols.length === 0) {
                    throw new Error('No se detectaron columnas de actividades en la hoja de calificaciones.');
                }

                // 3. Procesar filas e importar notas
                let successCount = 0;
                let warningCount = 0;
                let errorCount = 0;
                const logs = [];

                for (const row of dataRows) {
                    const estId = row[idEstudianteIdx];
                    const estNombre = row[nombreEstudianteIdx] || 'Estudiante Desconocido';

                    if (!estId) {
                        warningCount++;
                        logs.push(`<div class="import-row warning" style="margin: 0.25rem 0; padding: 0.25rem;">⚠️ Fila omitida: Nombre "${estNombre}" no tiene un ID de estudiante.</div>`);
                        continue;
                    }

                    for (const act of actividadCols) {
                        const notaVal = row[act.index];

                        // Si la celda está vacía, no modificamos para evitar sobrescribir notas existentes con blanco
                        if (notaVal === undefined || notaVal === null || notaVal === '') {
                            continue;
                        }

                        const parsedNota = parseFloat(notaVal);
                        if (isNaN(parsedNota) || parsedNota < 0 || parsedNota > 100) {
                            warningCount++;
                            logs.push(`<div class="import-row warning" style="margin: 0.25rem 0; padding: 0.25rem;">⚠️ Nota inválida (${notaVal}) para ${estNombre} en actividad ${act.id}. Debe ser entre 0 y 100.</div>`);
                            continue;
                        }

                        // Guardar la nota en Supabase
                        const result = await guardarNota(estId, act.id, parsedNota, 'Restaurado desde Backup');
                        if (result) {
                            successCount++;
                        } else {
                            errorCount++;
                            logs.push(`<div class="import-row error" style="margin: 0.25rem 0; padding: 0.25rem;">❌ Error guardando nota para ${estNombre} en actividad ${act.id}.</div>`);
                        }
                    }
                }

                if (progress) progress.classList.add('hidden');
                if (resultsDiv) {
                    resultsDiv.classList.remove('hidden');

                    let summaryHtml = `
                        <div class="alert alert-success" style="padding: 0.75rem 1rem; margin-bottom: 0.5rem;">
                            <strong>Importación finalizada con éxito:</strong><br>
                            - Notas restauradas/actualizadas: <strong>${successCount}</strong><br>
                            - Advertencias: <strong>${warningCount}</strong><br>
                            - Errores: <strong>${errorCount}</strong>
                        </div>
                    `;

                    if (logs.length > 0) {
                        summaryHtml += `<div style="max-height: 150px; overflow-y: auto; border: 1px solid var(--border-color); padding: 0.5rem; border-radius: 6px; background: var(--bg-primary);">${logs.join('')}</div>`;
                    }

                    resultsDiv.innerHTML = summaryHtml;
                }

                limpiarCachePromedios();
                showNotification(`Backup restaurado. Notas guardadas: ${successCount}`, 'success');
            } catch (err) {
                console.error(err);
                if (progress) progress.classList.add('hidden');
                if (resultsDiv) {
                    resultsDiv.classList.remove('hidden');
                    resultsDiv.innerHTML = `<div class="alert alert-danger" style="padding: 0.75rem 1rem;"><strong>Error:</strong> ${err.message}</div>`;
                }
                showNotification('Error al importar backup: ' + err.message, 'danger');
            }
        }

        //nueva tabla para renderizar estudiantes
        function renderTablaEstudiantes(estudiantes) {
            if (!estudiantes || estudiantes.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="empty-state-icon">👨‍🎓</div>
                        <h3>No se encontraron estudiantes</h3>
                        <p>Ajusta los filtros o agrega nuevos estudiantes</p>
                    </div>
                `;
            }

            // Crear mapa de secciones para búsqueda rápida (ID -> Nombre)
            const mapaSecciones = {};
            if (app.data.secciones) {
                app.data.secciones.forEach(s => mapaSecciones[s.id] = s.nombre);
            }

            let html = '<div class="table-container"><table><thead><tr>';
            html += '<th style="width: 50px;"><input type="checkbox" id="checkTodos" onchange="toggleTodos(this)"></th>';
            html += '<th>Código</th>';
            html += '<th>Nombre</th>';
            html += '<th>Grado y Sección</th>'; // ✅ Cabecera actualizada
            html += '<th>Email</th>';
            html += '<th>Estado</th>';
            html += '<th>Acciones</th>';
            html += '</tr></thead><tbody>';

            estudiantes.forEach(function (e) {
                const nombreSeguro = (e.nombre_completo || '').replace(/'/g, '&#39;').replace(/"/g, '&quot;');

                // ✅ LÓGICA NUEVA: Obtener nombre de sección
                const nombreSeccion = e.seccion_id && mapaSecciones[e.seccion_id]
                    ? `Sección "${mapaSecciones[e.seccion_id]}"`
                    : '<span style="color:#999; font-size:0.8em">(Sin sección)</span>';

                html += '<tr class="estudiante-row" data-estudiante-id="' + e.id + '">';
                html += '<td>';
                html += '<input type="checkbox" class="check-estudiante" ';
                html += 'data-estudiante-id="' + e.id + '" ';
                html += 'data-estudiante-nombre="' + nombreSeguro + '" ';
                html += 'onchange="actualizarContador()">';
                html += '</td>';
                html += '<td>' + (e.codigo_estudiante || 'N/A') + '</td>';
                html += '<td><strong>' + e.nombre_completo + '</strong></td>';

                // ✅ MOSTRAR GRADO Y SECCIÓN JUNTOS
                html += '<td>' + (e.grado_nombre || 'Sin grado') + '<br>' + nombreSeccion + '</td>';
                html += '<td>' + (e.email || 'N/A') + '</td>';

                const estadoBadge = e.activo
                    ? '<span class="badge badge-success">Activo</span>'
                    : '<span class="badge badge-danger">Inactivo</span>';
                html += '<td>' + estadoBadge + '</td>';

                html += '<td><div class="btn-group">';
                // Botón editar (Llama a la función nueva que pondremos en el paso 2)
                html += '<button class="btn btn-sm btn-secondary" onclick="editEstudiante(\'' + e.id + '\')">✏️</button>';
                // ✅ NUEVO: Botón Eliminar
                html += '<button class="btn btn-sm btn-danger" onclick="deleteEstudiante(\'' + e.id + '\')">🗑️</button>';
                html += '</div></td>';

        //PROCESAR ARCHIVO DE IMPORTACIÓN

        async function procesarArchivoEstudiantes(event) {
            const file = event.target.files[0];
            if (!file) return;

            const dropZone = document.getElementById('dropZoneEstudiantes');
            const progress = document.getElementById('importProgress');
            const resultsDiv = document.getElementById('importResults');

            dropZone.classList.add('hidden');
            progress.classList.remove('hidden');
            resultsDiv.classList.add('hidden');

            try {
                const data = await leerArchivo(file);
                if (!data || data.length === 0) throw new Error('El archivo está vacío');

                // 1. CARGAR DATOS FRESCOS DE LA BD
                // Es vital cargar esto justo antes de procesar para tener los IDs correctos
                await loadGrados();
                await loadSecciones();

                console.log(`📊 Referencias cargadas: ${app.data.grados.length} grados, ${app.data.secciones.length} secciones`);

                const resultados = { exitosos: [], errores: [], advertencias: [] };
                let contador = 0;

                for (const fila of data) {
                    contador++;

                    try {
                        // Validar datos mínimos
                        if (!fila.nombre_completo || !fila.email || !fila.password) {
                            resultados.errores.push({ fila: contador, email: '?', error: 'Faltan datos (nombre, email o pass)' });
                            continue;
                        }

                        // --- LÓGICA DE BÚSQUEDA EXACTA ---

                        let gradoId = null;
                        let seccionId = null;
                        let nombreGradoExcel = fila.grado ? fila.grado.toString().trim() : '';
                        let nombreSeccionExcel = fila.seccion ? fila.seccion.toString().trim() : '';

                        if (nombreGradoExcel) {
                            // 1. Buscar Grado (Insensible a mayúsculas/minúsculas)
                            const gradoEncontrado = app.data.grados.find(g =>
                                g.nombre.toLowerCase() === nombreGradoExcel.toLowerCase()
                            );

                            if (gradoEncontrado) {
                                gradoId = gradoEncontrado.id;

                                // 2. Buscar Sección DENTRO de ese grado
                                if (nombreSeccionExcel) {
                                    const seccionEncontrada = app.data.secciones.find(s =>
                                        s.grado_id === gradoId &&
                                        s.nombre.toLowerCase() === nombreSeccionExcel.toLowerCase()
                                    );

                                    if (seccionEncontrada) {
                                        seccionId = seccionEncontrada.id;
                                    } else {
                                        resultados.advertencias.push({
                                            fila: contador,
                                            email: fila.email,
                                            mensaje: `Sección "${nombreSeccionExcel}" no existe en ${gradoEncontrado.nombre}.`
                                        });
                                    }
                                }
                            } else {
                                resultados.advertencias.push({
                                    fila: contador,
                                    email: fila.email,
                                    mensaje: `Grado "${nombreGradoExcel}" no encontrado.`
                                });
                            }
                        }

                        // --- FIN LÓGICA BÚSQUEDA ---

                        // Preparar envío
                        const formData = new FormData();
                        formData.append('nombre_completo', fila.nombre_completo.trim());
                        formData.append('email', fila.email.trim().toLowerCase());
                        formData.append('password', fila.password);
                        formData.append('codigo_estudiante', fila.codigo_estudiante || '');

                        if (gradoId) formData.append('grado_id', gradoId);
                        if (seccionId) formData.append('seccion_id', seccionId); // ¡Aquí va el ID real de la sección!

                        // Llamar a la función de creación (que ya arreglamos antes)
                        const success = await createEstudiante(formData);

                        if (success) {
                            let detalle = 'Creado sin grado';
                            if (gradoId) detalle = `Grado: ${nombreGradoExcel}`;
                            if (seccionId) detalle += ` | Sección: ${nombreSeccionExcel}`;

                            resultados.exitosos.push({
                                fila: contador,
                                email: fila.email,
                                nombre: fila.nombre_completo,
                                detalle: detalle // Para mostrar en el reporte final
                            });
                        } else {
                            resultados.errores.push({ fila: contador, email: fila.email, error: 'Error al crear (posible duplicado)' });
                        }

                        // Pausa para estabilidad
                        await new Promise(r => setTimeout(r, 50));

                    } catch (e) {
                        console.error(e);
                        resultados.errores.push({ fila: contador, email: fila.email, error: e.message });
                    }
                }

                // Mostrar resultados (UI)
                progress.classList.add('hidden');
                resultsDiv.classList.remove('hidden');

                let html = '<h3>📊 Importación Finalizada</h3>';

                if (resultados.exitosos.length > 0) {
                    html += `<div class="alert alert-success">✅ ${resultados.exitosos.length} estudiantes procesados</div>`;
                    // Mostrar lista pequeña de éxitos para confirmar visualmente
                    html += `<div style="max-height:150px; overflow-y:auto; font-size:0.85rem; margin-bottom:1rem; border:1px solid #ddd;">`;
                    resultados.exitosos.forEach(r => {
                        html += `<div style="padding:4px; border-bottom:1px solid #eee;">✅ <b>${r.nombre}</b> - ${r.detalle}</div>`;
                    });
                    html += `</div>`;
                }

                if (resultados.advertencias.length > 0) {
                    html += `<div class="alert alert-warning">⚠️ ${resultados.advertencias.length} problemas de grado/sección (revisar nombres)</div>`;
                    html += `<div style="max-height:100px; overflow-y:auto; font-size:0.85rem;">` +
                        resultados.advertencias.map(a => `<div>⚠️ ${a.mensaje}</div>`).join('') + `</div>`;
                }

                if (resultados.errores.length > 0) {
                    html += `<div class="alert alert-danger">❌ ${resultados.errores.length} fallos críticos</div>`;
                }

                html += `<button class="btn btn-primary mt-2" onclick="this.closest('.modal').remove(); renderView('estudiantes');">Cerrar</button>`;
                resultsDiv.innerHTML = html;

            } catch (error) {
                progress.classList.add('hidden');
                resultsDiv.classList.remove('hidden');
                resultsDiv.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        }                //finaliza función procesar estudiante


        //FUNCIÓN PARA LEER ARCHIVO

        function leerArchivo(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                        console.log('📄 Archivo leído:', jsonData.length, 'filas');
                        resolve(jsonData);
                    } catch (error) {
                        reject(new Error('Error al leer el archivo: ' + error.message));
                    }
                };

                reader.onerror = () => {
                    reject(new Error('Error al leer el archivo'));
                };

                reader.readAsArrayBuffer(file);
            });
        }

                    mensaje += `\n\n⚠️ ADVERTENCIA: Este grado tiene ${secciones.length} sección(es):\n\n`;

                }

                if (estudiantes && estudiantes.length > 0) {
                    tieneRelaciones = true;
                    mensaje += `\n\n⚠️ ESTUDIANTES: Hay ${estudiantes.length} estudiante(s) asignados a este grado:\n\n`;

                showNotification('Eliminando grado...', 'info');

                if (secciones && secciones.length > 0) {

                }

                showNotification('Error al eliminar el grado: ' + error.message, 'danger');

        }

        async function deleteSeccion(id, nombre) {

                const { data: inscripciones, error: inscError } = await supabaseClient
                    .from('estudiante_cursos')
                    .select('id, estudiante_id, profiles(nombre_completo)')
                    .eq('seccion_id', id)
                    .limit(5);

                if (inscError) {
                    console.error('Error verificando inscripciones:', inscError);
                }

                // Verificar si tiene asignaciones de cursos
                const { data: asignaciones, error: asigError } = await supabaseClient
                    .from('curso_asignaciones')
                    .select('id, cursos(nombre)')
                    .eq('seccion_id', id)
                    .limit(5);

                if (asigError) {
                    console.error('Error verificando asignaciones:', asigError);
                }

                let mensaje = `¿Estás seguro de eliminar la sección "${nombre}"?`;
                let tieneRelaciones = false;

                if (inscripciones && inscripciones.length > 0) {
                    tieneRelaciones = true;
                    mensaje += `\n\n⚠️ INSCRIPCIONES: Esta sección tiene ${inscripciones.length} estudiante(s) inscrito(s):\n\n`;
                    inscripciones.forEach(i => {
                        mensaje += `• ${i.profiles?.nombre_completo || 'Desconocido'}\n`;
                    });
                    mensaje += '\nEstas inscripciones serán eliminadas.';
                }

                if (asignaciones && asignaciones.length > 0) {
                    tieneRelaciones = true;
                    mensaje += `\n\n⚠️ ASIGNACIONES: Esta sección tiene ${asignaciones.length} curso(s) asignado(s):\n\n`;
                    asignaciones.forEach(a => {
                        mensaje += `• ${a.cursos?.nombre || 'Desconocido'}\n`;
                    });
                    mensaje += '\nEstas asignaciones serán eliminadas.';
                }

                if (!confirm(mensaje)) {
                    return;
                }

                if (tieneRelaciones) {
                    if (!confirm('⚠️ CONFIRMACIÓN FINAL:\n\n¿Realmente deseas continuar?')) {
                        return;
                    }
                }

                showNotification('Eliminando sección...', 'info');

                // Eliminar inscripciones asociadas
                if (inscripciones && inscripciones.length > 0) {
                    await supabaseClient
                        .from('estudiante_cursos')
                        .delete()
                        .eq('seccion_id', id);
                }

                // Eliminar asignaciones asociadas
                if (asignaciones && asignaciones.length > 0) {
                    await supabaseClient
                        .from('curso_asignaciones')
                        .delete()
                        .eq('seccion_id', id);
                }

                // Eliminar la sección
                const success = await deleteData('secciones', id);

                if (success) {
                    await loadSecciones();
                    await renderView('grados');

                    let mensajeExito = 'Sección eliminada exitosamente';
                    if (inscripciones && inscripciones.length > 0) {

                    if (asignaciones && asignaciones.length > 0) {
                        mensajeExito += `. ${asignaciones.length} asignación(es) eliminada(s)`;
                    }

                    showNotification(mensajeExito, 'success');
                }

            } catch (error) {
                console.error('Error eliminando sección:', error);
                showNotification('Error al eliminar la sección: ' + error.message, 'danger');
            }
        }

        function filtrarUnidadesPorAño() {
            const añoSelect = document.getElementById('filtroAñoUnidades');

            const totalBadge = document.getElementById('totalUnidades');

            if (!añoSelect || !tablaContainer) return;

                // Mostrar todas
                unidadesFiltradas = app.data.unidades;
            } else {
                // Filtrar por año
                unidadesFiltradas = app.data.unidades.filter(u => u.año === parseInt(añoSeleccionado));

            console.log('🔍 Filtrando unidades por año:', añoSeleccionado || 'Todos', '- Resultados:', unidadesFiltradas.length);

            // Actualizar tabla
            tablaContainer.innerHTML = renderTablaUnidades(unidadesFiltradas);

            if (totalBadge) {
                totalBadge.textContent = `${unidadesFiltradas.length} ${añoSeleccionado ? 'en ' + añoSeleccionado : 'Total'}`;
            }
        }

        //FUNCIÓN PARA ELIMINAR UNIDAD
        async function deleteUnidad(id, nombre) {
            // Verificar si tiene actividades asociadas
            const { data: actividades, error } = await supabaseClient
                .from('actividades')
                .select('id, titulo')
                .eq('unidad_id', id)
                .limit(5);

            if (error) {
                console.error('Error verificando actividades:', error);
            }

            let mensaje = `¿Estás seguro de eliminar la unidad "${nombre}"?`;

            if (actividades && actividades.length > 0) {
                mensaje += `\n\n⚠️ ADVERTENCIA: Esta unidad tiene ${actividades.length} actividad(es) asociada(s):\n\n`;
                actividades.forEach(act => {
                    mensaje += `• ${act.titulo}\n`;
                });
                mensaje += '\nAl eliminar la unidad, estas actividades quedarán sin unidad asignada.';
            }

            if (!confirm(mensaje)) {
                return;
            }

            // Confirmación adicional si hay actividades
            if (actividades && actividades.length > 0) {
                if (!confirm('⚠️ CONFIRMACIÓN FINAL:\n\n¿Realmente deseas continuar con la eliminación?')) {
                    return;
                }
            }

            try {
                showNotification('Eliminando unidad...', 'info');

                // Eliminar la unidad
                const success = await deleteData('unidades', id);

                if (success) {
                    await loadUnidades();
                    await renderView('unidades');

                    if (actividades && actividades.length > 0) {
                        showNotification(
                            `Unidad eliminada. ${actividades.length} actividades quedaron sin unidad asignada.`,
                            'warning'
                        );
                    }
                }
            } catch (error) {
                console.error('Error eliminando unidad:', error);
                showNotification('Error al eliminar la unidad: ' + error.message, 'danger');
            }
        }

        async function verDetallesCurso(cursoId, gradoId, seccionId) {
            // Recuperación de fallos (por si recargas página)
            if (!gradoId || !seccionId) {
                const asignacion = app.data.misCursos.find(mc => mc.curso_id === cursoId);
                if (asignacion) {
                    gradoId = asignacion.secciones.grado_id;
                    seccionId = asignacion.secciones.id;
                }
            }

            await loadUnidades();
            // Cargar actividades SOLO de esta sección
            await loadActividades(cursoId, gradoId, seccionId);

            // ✅ Limpiar filtro de unidad del libro al entrar a un curso
            window._libroUnidadFiltro = '';

            const cursoObj = app.data.misCursos.find(mc => mc.curso_id === cursoId);
            const curso = cursoObj ? cursoObj.cursos : { nombre: 'Curso', descripcion: '' };
            const nombreSeccion = cursoObj ? cursoObj.secciones.nombre : '';

            // Lógica para toggle de modo (PERSISTENCIA EN DESCRIPCIÓN)
            const TAG_ICONOS = '[ICONOS]';
            const rawDescription = curso.descripcion || '';
            const isIcons = rawDescription.includes(TAG_ICONOS);
            const cleanDescription = rawDescription.replace(TAG_ICONOS, '').trim();

            window.toggleModoCalificacion = async function (modoDestino) {
                const currentIsIcons = curso.descripcion && curso.descripcion.includes(TAG_ICONOS);
                let newDesc = rawDescription;
                if (modoDestino === 'iconos' && !currentIsIcons) {
                    newDesc = rawDescription + ' ' + TAG_ICONOS;
                } else if (modoDestino === 'numerica' && currentIsIcons) {
                    newDesc = rawDescription.replace(TAG_ICONOS, '').trim();
                } else {
                    return;
                }

                if (confirm(`¿Cambiar modo a ${modoDestino.toUpperCase()}?`)) {
                    const { error } = await supabaseClient
                        .from('cursos')
                        .update({ descripcion: newDesc })
                        .eq('id', cursoId);

                    if (!error) {
                        curso.descripcion = newDesc;
                        verDetallesCurso(cursoId, gradoId, seccionId);
                        showNotification(`Modo cambiado a ${modoDestino}`, 'success');
                    } else {
                        showNotification('Error al cambiar modo: ' + error.message, 'danger');
                    }
                }
            };

            const actividadesPorUnidad = {};
            app.data.unidades.forEach(u => {
                actividadesPorUnidad[u.id] = app.data.actividades.filter(a => a.unidad_id === u.id);
            });

            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <span>📚 ${curso.nombre} <span class="badge badge-info">Sec. ${nombreSeccion}</span></span>
                        <div class="btn-group">
                            <button class="btn btn-info btn-sm" onclick="abrirLibroCalificaciones('${cursoId}', '${gradoId}', '${seccionId}')">
                                📊 Libro de Calificaciones
                            </button>
                            <button class="btn btn-secondary btn-sm" onclick="renderView('mis-cursos')">
                                ← Volver
                            </button>
                        </div>
                    </div>
                    <p>${cleanDescription || 'Sin descripción'}</p>
                    
                    <div class="mt-2 p-2" style="background: var(--bg-primary); border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
                        <span><strong>Modo de Calificación:</strong> ${isIcons ? 'Iconos (Simpático)' : 'Numérico (Tradicional)'}</span>
                        <div class="btn-group">
                             <button class="btn btn-sm ${!isIcons ? 'btn-primary' : 'btn-secondary'}" onclick="toggleModoCalificacion('numerica')">🔢 1-100</button>
                             <button class="btn btn-sm ${isIcons ? 'btn-primary' : 'btn-secondary'}" onclick="toggleModoCalificacion('iconos')">😄 Iconos</button>
                        </div>
                    </div>
                </div>

                ${app.data.unidades.length > 0 ? app.data.unidades.map(unidad => `
                    <div class="card">
                        <div class="card-header">
                            <span>📖 Unidad ${unidad.numero}: ${unidad.nombre}</span>
                            <button class="btn btn-primary btn-sm" onclick="showCreateActividadModal('${cursoId}', '${gradoId}', '${seccionId}')">
                                + Nueva Actividad
                            </button>
                        </div>

                        ${actividadesPorUnidad[unidad.id]?.length > 0 ? `
                            ${actividadesPorUnidad[unidad.id].map(act => `
                                <div class="actividad-item">
                                    <div class="flex justify-between items-center">
                                        <div>
                                            <h4>${act.titulo}</h4>
                                            <p>${act.descripcion || ''}</p>
                                            <div class="mt-1">
                                                <span class="badge badge-primary">${act.tipo}</span>
                                                <span class="badge badge-success">Max: ${act.puntaje_maximo}</span>
                                                ${act.fecha_entrega ? `<span class="badge badge-warning">📅 ${new Date(act.fecha_entrega).toLocaleDateString()}</span>` : ''}
                                            </div>
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-danger" onclick="deleteActividad('${act.id}', '${cursoId}', '${gradoId}', '${seccionId}')">

                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        ` : `
                            <p style="color: var(--text-secondary); text-align: center; padding: 2rem;">
                                No hay actividades en esta sección.
                            </p>
                        `}
                    </div>
                `).join('') : `<div class="card"><div class="alert alert-warning">⚠️ Sin unidades.</div></div>`}

                <div class="card">

                        <span>📅 Control de Asistencia</span>

                    <div style="text-align: center; padding: 1.5rem;">
                        <p>Registra la asistencia diaria de tus estudiantes en esta sección.</p>

            `;

        // ==========================================
        // VISTA DE TOMA DE ASISTENCIA (MAESTRO)
        // ==========================================
        async function abrirAsistencia(cursoId, gradoId, seccionId) {
            const content = document.getElementById('mainContent');
            content.innerHTML = showLoading('Cargando lista de estudiantes...');

            try {
                // Obtener estudiantes inscritos en esta sección
                const { data: inscritos, error: inscError } = await supabaseClient
                    .from('estudiante_cursos')
                    .select('estudiante_id, profiles(id, nombre_completo, codigo_estudiante)')
                    .eq('seccion_id', seccionId)
                    .eq('curso_id', cursoId)
                    .eq('activo', true);

                if (inscError) throw inscError;

                const fechaHoy = new Date().toISOString().split('T')[0];
                const asistenciaExistente = await loadAsistencia(cursoId, seccionId, fechaHoy);

                const cursoObj = app.data.misCursos.find(mc => mc.curso_id === cursoId);
                const cursoNombre = cursoObj ? cursoObj.cursos.nombre : 'Curso';

                let html = `
                    <div class="card">
                        <div class="card-header">
                            <span>📝 Asistencia: ${cursoNombre}</span>
                            <div class="btn-group">
                                <button class="btn btn-secondary btn-sm" onclick="verDetallesCurso('${cursoId}', '${gradoId}', '${seccionId}')">
                                    ← Volver
                                </button>
                            </div>
                        </div>
                        
                        <div class="mt-2 flex justify-between items-center" style="background: var(--bg-primary); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                            <div>
                                <strong>Fecha:</strong> 
                                <input type="date" id="fechaAsistencia" value="${fechaHoy}" class="form-input" style="display:inline-block; width:auto;" onchange="recargarAsistencia('${cursoId}', '${seccionId}')">
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-success btn-sm" onclick="marcarTodosAsistencia('presente')">✅ Todos Presentes</button>
                                <button class="btn btn-danger btn-sm" onclick="marcarTodosAsistencia('ausente')">❌ Todos Ausentes</button>
                            </div>
                        </div>

                        <div class="table-container">
                            <table style="width: 100%;">
                                <thead>
                                    <tr>
                                        <th>Estudiante</th>
                                        <th style="text-align: center;">Estado</th>
                                        <th>Observaciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAsistenciaCuerpo">
                                    ${inscritos.map(i => {
                    const est = i.profiles;
                    const registro = asistenciaExistente.find(a => a.estudiante_id === est.id);
                    const estado = registro ? registro.estado : 'presente';
                    const obs = registro ? (registro.observaciones || '') : '';

                    return `
                                            <tr data-estudiante-id="${est.id}">
                                                <td>
                                                    <strong>${est.nombre_completo}</strong><br>
                                                    <small>${est.codigo_estudiante || ''}</small>
                                                </td>
                                                <td style="text-align: center;">
                                                    <div class="btn-group" style="justify-content: center;">
                                                        <label class="asistencia-label">
                                                            <input type="radio" name="estado_${est.id}" value="presente" ${estado === 'presente' ? 'checked' : ''}>
                                                            <span class="asistencia-btn presente">P</span>
                                                        </label>
                                                        <label class="asistencia-label">
                                                            <input type="radio" name="estado_${est.id}" value="ausente" ${estado === 'ausente' ? 'checked' : ''}>
                                                            <span class="asistencia-btn ausente">A</span>
                                                        </label>
                                                        <label class="asistencia-label">
                                                            <input type="radio" name="estado_${est.id}" value="tarde" ${estado === 'tarde' ? 'checked' : ''}>
                                                            <span class="asistencia-btn tarde">T</span>
                                                        </label>
                                                        <label class="asistencia-label">
                                                            <input type="radio" name="estado_${est.id}" value="justificado" ${estado === 'justificado' || estado === 'excusa' || estado === 'permiso' ? 'checked' : ''}>
                                                            <span class="asistencia-btn permiso">E</span>
                                                        </label>
                                                    </div>
                                                </td>
                                                <td>
                                                    <input type="text" class="form-input sm" name="obs_${est.id}" value="${obs}" placeholder="...">
                                                </td>
                                            </tr>
                                        `;
                }).join('')}
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-2 text-right">
                            <button class="btn btn-primary btn-lg" onclick="guardarAsistenciaActual('${cursoId}', '${seccionId}')">
                                💾 Guardar Asistencia
                            </button>
                        </div>
                    </div>

                    <style>
                        .asistencia-label input { display: none; }
                        .asistencia-btn {
                            display: inline-block;
                            width: 35px;
                            height: 35px;
                            line-height: 35px;
                            text-align: center;
                            border-radius: 50%;
                            background: #eee;
                            cursor: pointer;
                            font-weight: bold;
                            transition: all 0.2s;
                            border: 2px solid transparent;
                        }
                        .asistencia-label input:checked + .asistencia-btn.presente { background: var(--success); color: white; border-color: #2e7d32; }
                        .asistencia-label input:checked + .asistencia-btn.ausente { background: var(--danger); color: white; border-color: #c62828; }
                        .asistencia-label input:checked + .asistencia-btn.tarde { background: var(--warning); color: white; border-color: #f9a825; }
                        .asistencia-label input:checked + .asistencia-btn.permiso { background: var(--info); color: white; border-color: #1565c0; }
                    </style>
                `;

                content.innerHTML = html;

                // Funciones globales temporales para esta vista
                window.marcarTodosAsistencia = (estado) => {
                    document.querySelectorAll(`input[value="${estado}"]`).forEach(input => input.checked = true);
                };

                window.recargarAsistencia = async (cId, sId) => {
                    const fecha = document.getElementById('fechaAsistencia').value;
                    abrirAsistencia(cId, gradoId, sId); // Recarga completa para simplificar
                };

                window.guardarAsistenciaActual = async (cId, sId) => {
                    const fecha = document.getElementById('fechaAsistencia').value;
                    const filas = document.querySelectorAll('#tablaAsistenciaCuerpo tr');
                    const registros = [];

                    filas.forEach(fila => {
                        const estId = fila.getAttribute('data-estudiante-id');
                        const estado = fila.querySelector(`input[name="estado_${estId}"]:checked`).value;
                        const obs = fila.querySelector(`input[name="obs_${estId}"]`).value;

                        registros.push({
                            estudiante_id: estId,
                            curso_id: cId,
                            fecha: fecha,
                            estado: estado,
                            observaciones: obs,
                            registrado_por: app.currentUser.id
                        });
                    });

                    const success = await saveAsistenciaMasiva(registros);
                    if (success) {

                let query = supabaseClient
                    .from('asistencia')
                    .select('*, profiles:estudiante_id(nombre_completo), cursos(nombre)')
                    .order('fecha', { ascending: false });

                if (cursoId) query = query.eq('curso_id', cursoId);

                if (fechaInicio) query = query.gte('fecha', fechaInicio);

        // ==========================================
        // VISTA ESTUDIANTE CORREGIDA (FILTRO SECCIÓN)
        // ==========================================
        async function generarHTMLCursoEstudiante(mc, estudianteId) {
            const curso = mc.cursos;
            const mostrarNotas = app.data.institucion?.mostrar_notas !== false;

            // 1. OBTENER LA SECCIÓN REAL DEL ESTUDIANTE EN ESTE CURSO
            // Consultamos la tabla de inscripciones para saber en qué sección está inscrito
            const { data: inscripcion } = await supabaseClient
                .from('estudiante_cursos')
                .select('seccion_id')
                .eq('estudiante_id', estudianteId)
                .eq('curso_id', curso.id)
                .eq('activo', true)
                .single();

            const seccionId = inscripcion ? inscripcion.seccion_id : null;

            if (!seccionId) {
                return `<div class="card alert-danger">Error: No tienes sección asignada en ${curso.nombre}</div>`;
            }

            // 2. CARGAR ACTIVIDADES FILTRADAS POR SECCIÓN (Adiós fantasmas)
            const { data: actividades } = await supabaseClient
                .from('actividades')
                .select(`*, unidades(id,numero,nombre), notas!left(nota,observaciones)`)
                .eq('curso_id', curso.id)
                .eq('seccion_id', seccionId) // ✅ FILTRO CLAVE
                .eq('notas.estudiante_id', estudianteId)
                .order('created_at', { ascending: false });

            const totalActividades = actividades?.length || 0;
            const actividadesConNota = actividades?.filter(a => a.notas && a.notas.length > 0).length || 0;
            const actividadesPendientes = totalActividades - actividadesConNota;

            const promedioCurso = mostrarNotas ? await calcularPromedioCurso(estudianteId, curso.id) : '🔒';

            // Agrupar
            const actividadesPorUnidad = {};
            if (actividades) {
                actividades.forEach(act => {
                    if (!actividadesPorUnidad[act.unidad_id]) actividadesPorUnidad[act.unidad_id] = [];
                    actividadesPorUnidad[act.unidad_id].push(act);
                });
            }

            let html = `
                <div class="card">
                    <div class="card-header" style="background: linear-gradient(135deg, ${curso.color || '#1877f2'}, var(--facebook-blue-dark)); color: white;">
                        <div>
                            <h2 style="color:white; margin:0;">${curso.nombre}</h2>
                            <p style="margin:0; opacity:0.9;">${curso.codigo || ''}</p>
                        </div>
                        <div class="promedio-display" style="background:rgba(255,255,255,0.2);">Promedio: ${promedioCurso}</div>
                    </div>
                    <!-- Stats igual que antes... -->
                    <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin: 1rem 0;">
                        <div style="background:#e7f3ff; padding:0.5rem; text-align:center; border-radius:8px;">Total: ${totalActividades}</div>
                        <div style="background:#d4edda; padding:0.5rem; text-align:center; border-radius:8px;">Listas: ${actividadesConNota}</div>
                        <div style="background:#fff3cd; padding:0.5rem; text-align:center; border-radius:8px;">Pendientes: ${actividadesPendientes}</div>
                    </div>
            `;

            // Renderizado de actividades (con cálculo ponderado visual)
            if (Object.keys(actividadesPorUnidad).length > 0) {
                for (const unidadId in actividadesPorUnidad) {
                    const acts = actividadesPorUnidad[unidadId];
                    const unidad = acts[0]?.unidades;
                    html += `<h4 style="color:var(--facebook-blue); margin:1rem 0;">📖 ${unidad?.nombre || 'Unidad'}</h4>`;

                    for (const act of acts) {
                        const notaObj = act.notas?.[0];
                        const tieneNota = !!notaObj;
                        const notaRaw = tieneNota ? parseFloat(notaObj.nota) : 0;

                        // Calcular puntos netos para mostrar al alumno
                        const puntosNetos = (notaRaw / 100) * act.puntaje_maximo;

                        let display = '';
                        let borde = 'var(--warning)';

                        if (tieneNota) {
                            if (mostrarNotas) {
                                borde = notaRaw >= 60 ? 'var(--success)' : 'var(--danger)';

                                // --- LÓGICA DE ICONOS ESTUDIANTE ---
                                const isIconMode = curso.descripcion && curso.descripcion.includes('[ICONOS]');

                                if (isIconMode) {
                                    const info = getGradingInfo(notaRaw);
                                    // Sobreescribimos el display para usar la tarjeta de iconos
                                    display = `
                                        <div style="text-align:center;">
                                            <div style="font-size: 2rem;">${info.faceIcon}</div>
                                            <div style="font-size: 0.8rem;">${info.simpleStars}</div>
                                            <span class="badge" style="background:${info.colorCode}; color:white;">${info.label}</span>
                                        </div>
                                    `;
                                } else {
                                    // MODO NORMAL (NUMÉRICO)
                                    display = `
                                        <div style="text-align:right;">
                                            <strong style="font-size:1.2em; color:${borde}">
                                                ${puntosNetos.toFixed(2)} / ${act.puntaje_maximo} pts
                                            </strong><br>
                                            <small style="color:#666;">(${notaRaw}% de la nota)</small>
                                        </div>
                                    `;
                                }
                                // -----------------------------------

                            } else {
                                borde = 'var(--info)';
                                display = '<span class="badge badge-info">🔒 Calificado</span>';
                            }
                        } else {
                            display = '<span class="badge badge-warning">⏳ Pendiente</span>';
                        }

                        html += `
                            <div class="actividad-item" style="border-left: 4px solid ${borde}; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <strong style="display:block;">${act.titulo}</strong>
                                    <small class="badge badge-secondary">Valor: ${act.puntaje_maximo} pts</small>
                                    ${act.descripcion ? `<p style="font-size:0.85rem; color:#666; margin:0.2rem 0;">${act.descripcion}</p>` : ''}
                                </div>
                                <div>${display}</div>
                            </div>
                        `;
                    }
                }
            } else {
                html += '<p style="text-align:center; padding:1rem;">No hay tareas asignadas.</p>';
            }

            html += '</div>';
            return html;
        }// finaliza vista estudiante

        // ==========================================
        // FUNCIÓN PARA DESCARGAR BOLETA PDF
        // ==========================================
        async function downloadBoletaPDF() {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Datos de la institución
                const institucionNombre = app.data.institucion?.nombre || 'Instituto Educativo';
                const anio = new Date().getFullYear();

                // Encabezado
                doc.setFontSize(18);
                doc.text(institucionNombre, 105, 20, { align: 'center' });
                doc.setFontSize(14);
                doc.text('BOLETA DE CALIFICACIONES', 105, 30, { align: 'center' });
                doc.setFontSize(12);
                doc.text(`Año Lectivo ${anio}`, 105, 40, { align: 'center' });

                // Datos del Estudiante
                doc.setFontSize(10);
                doc.text(`Estudiante: ${app.currentUser.nombre_completo}`, 14, 55);
                doc.text(`Código: ${app.currentUser.codigo_estudiante || 'N/A'}`, 14, 60);
                doc.text(`Email: ${app.currentUser.email}`, 14, 65);
                doc.text(`Fecha de impresión: ${new Date().toLocaleDateString()}`, 14, 70);

                // Preparar datos para la tabla
                const headers = [['CURSO', ...app.data.unidades.map(u => `U${u.numero}`), 'PROM.']];
                const rows = [];

                let sumaPromedios = 0;
                let cursosConNotas = 0;

                for (const mc of app.data.misCursos) {
                    const curso = mc.cursos;
                    const rowData = [curso.nombre];

                    let promedioCurso = 0;

                    // obtener notas por unidad
                    for (const unidad of app.data.unidades) {
                        const promedioUnidad = await calcularPromedioUnidad(app.currentUser.id, curso.id, unidad.id);
                        rowData.push(promedioUnidad > 0 ? promedioUnidad : '-');
                    }

                    // promedio del curso
                    promedioCurso = await calcularPromedioCurso(app.currentUser.id, curso.id);
                    if (parseFloat(promedioCurso) > 0) {
                        sumaPromedios += parseFloat(promedioCurso);
                        cursosConNotas++;
                        rowData.push(promedioCurso);
                    } else {
                        rowData.push('-');
                    }

                    rows.push(rowData);
                }

                // Generar tabla
                doc.autoTable({
                    startY: 75,
                    head: headers,
                    body: rows,
                    headStyles: { fillColor: [66, 133, 244] },
                    theme: 'grid'
                });

                // Promedio General
                const promedioGeneral = cursosConNotas > 0 ? (sumaPromedios / cursosConNotas).toFixed(2) : '0.00';
                const finalY = doc.lastAutoTable.finalY + 10;

                doc.setFontSize(12);
                doc.setFont(undefined, 'bold');
                doc.text(`Promedio General: ${promedioGeneral}`, 14, finalY);

                // Guardar PDF
                doc.save(`Boleta_${app.currentUser.nombre_completo.replace(/\s+/g, '_')}_${anio}.pdf`);

            } catch (error) {
                console.error('Error generando PDF:', error);
                alert('Hubo un error al generar el PDF. Por favor intenta nuevamente.');
            }
        }

        // ==========================================

        // 1. Cuando cambia el Grado
        function filtrarBoletasPorGrado() {
            const gradoId = document.getElementById('filtroGradoBoleta').value;
            const seccionSelect = document.getElementById('filtroSeccionBoleta');
            const btnExportarGrado = document.getElementById('btnExportarGrado'); // Referencia al botón azul

            seccionSelect.innerHTML = '<option value="">Todas las secciones</option>';

            if (gradoId) {
                // Habilitar secciones
                seccionSelect.disabled = false;
                const seccionesFiltradas = app.data.secciones.filter(s => s.grado_id === gradoId);
                seccionesFiltradas.forEach(s => {
                    const option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = `Sección ${s.nombre}`;
                    seccionSelect.appendChild(option);
                });

                // ✅ HABILITAR EL BOTÓN AZUL SI HAY GRADO SELECCIONADO
                if (btnExportarGrado) btnExportarGrado.disabled = false;

            } else {
                seccionSelect.disabled = true;
                // ❌ DESHABILITAR SI NO HAY GRADO
                if (btnExportarGrado) btnExportarGrado.disabled = true;
            }

            aplicarFiltrosBoletas();
        }

        // 2. Cuando cambia la Sección
        function filtrarBoletasPorSeccion() {
            aplicarFiltrosBoletas();
        }

        // 3. Cuando escribe texto
        function filtrarBoletasPorTexto() {
            aplicarFiltrosBoletas();
        }

        // 4. MOTOR DE FILTRADO (La lógica central)
        function aplicarFiltrosBoletas() {
            const gradoId = document.getElementById('filtroGradoBoleta').value;
            const seccionId = document.getElementById('filtroSeccionBoleta').value;
            const texto = document.getElementById('filtroTextoBoleta').value.toLowerCase().trim();

            console.log('🔍 Filtrando boletas:', { gradoId, seccionId, texto });

            // Empezamos con todos los estudiantes
            let filtrados = app.data.estudiantes.slice();

            // Filtro Grado
            if (gradoId) {
                filtrados = filtrados.filter(e => e.grado_id === gradoId);
            }

            // Filtro Sección
            if (seccionId) {
                filtrados = filtrados.filter(e => e.seccion_id === seccionId);
            }

            // Filtro Texto (Nombre, Email o Código)
            if (texto) {
                filtrados = filtrados.filter(e =>
                    (e.nombre_completo && e.nombre_completo.toLowerCase().includes(texto)) ||
                    (e.codigo_estudiante && e.codigo_estudiante.toLowerCase().includes(texto)) ||
                    (e.email && e.email.toLowerCase().includes(texto))
                );
            }

            // Renderizar la tabla actualizada
            const contenedor = document.getElementById('listaEstudiantesBoletas');
            if (contenedor) {
                contenedor.innerHTML = renderListaEstudiantes(filtrados);
            }

            // Reiniciar contador de seleccionados visualmente
            const contador = document.getElementById('contadorSeleccionados');
            if (contador) contador.textContent = "0 seleccionados";

            const btn = document.getElementById('btnExportarMasivo');
            if (btn) btn.disabled = true;
        }

        // Filtrar por grado
        async function filtrarPorGrado() {
            const gradoId = document.getElementById('filtroGrado').value;
            const selectSeccion = document.getElementById('filtroSeccion');
            const selectEstudiante = document.getElementById('filtroEstudiante');
            const btnExportarGrado = document.getElementById('btnExportarGrado');

            // Resetear filtro de estudiante
            selectEstudiante.value = '';

            if (!gradoId) {
                // Si no hay grado seleccionado, deshabilitar sección y mostrar todos
                selectSeccion.disabled = true;
                selectSeccion.innerHTML = '<option value="">Todas las secciones</option>';

                // Deshabilitar botón de exportar grado
                if (btnExportarGrado) btnExportarGrado.disabled = true;

                await aplicarFiltros();
                return;
            }

            // Habilitar botón de exportar grado completo
            if (btnExportarGrado) btnExportarGrado.disabled = false;

            // Habilitar y cargar secciones del grado
            selectSeccion.disabled = false;
            const seccionesDelGrado = app.data.secciones.filter(s => s.grado_id === gradoId);

            selectSeccion.innerHTML = `
                <option value="">Todas las secciones</option>
                ${seccionesDelGrado.map(s => `
                    <option value="${s.id}">Sección ${s.nombre} (${s.año})</option>
                `).join('')}
            `;

            await aplicarFiltros();
        }
        // Filtrar por sección
        async function filtrarPorSeccion() {
            await aplicarFiltros();
        }

        // ==========================================
        // FUNCIÓN FALTANTE: HABILITA EL SELECT DE SECCIONES
        // ==========================================
        function actualizarSeccionesFiltro() {
            const gradoId = document.getElementById('filtroGradoEstudiantes').value;
            const seccionSelect = document.getElementById('filtroSeccionEstudiantes');

            // 1. Limpiar opciones anteriores
            seccionSelect.innerHTML = '<option value="">Todas las secciones</option>';

            if (gradoId) {
                // 2. Buscar secciones que pertenecen a este grado
                const seccionesDelGrado = app.data.secciones.filter(s => s.grado_id === gradoId);

                // 3. Llenar el select
                seccionesDelGrado.forEach(s => {

                seccionSelect.disabled = true;

        // FUNCIÓN DE FILTRADO DE ESTUDIANTES (ÚNICA Y DEFINITIVA)
        // ==========================================
        function filtrarEstudiantes() {
            // 1. Obtener elementos del DOM
            const gradoSelect = document.getElementById('filtroGradoEstudiantes');
            const seccionSelect = document.getElementById('filtroSeccionEstudiantes');
            const textoInput = document.getElementById('filtroTextoEstudiantes');
            const estadoSelect = document.getElementById('filtroEstadoEstudiantes');
            const badgeTotal = document.getElementById('totalEstudiantes');

            // Validación de seguridad
            if (!gradoSelect || !seccionSelect || !textoInput) return;

            // 2. Obtener valores
            const gradoId = gradoSelect.value;
            const seccionId = seccionSelect.value;
            const texto = textoInput.value.toLowerCase().trim();
            const estado = estadoSelect ? estadoSelect.value : '';

            console.log('🔍 Filtrando estudiantes por:', { gradoId, seccionId, texto });

            // 3. Filtrar datos en memoria (más rápido que consultar BD)
            let resultados = app.data.estudiantes.slice();

            // Filtro Grado
            if (gradoId) {
                resultados = resultados.filter(e => e.grado_id === gradoId);
            }

            // Filtro Sección
            if (seccionId) {
                resultados = resultados.filter(e => e.seccion_id === seccionId);
            }

            // Filtro Texto (Nombre, código, email)
            if (texto) {
                resultados = resultados.filter(e =>
                    (e.nombre_completo && e.nombre_completo.toLowerCase().includes(texto)) ||
                    (e.codigo_estudiante && e.codigo_estudiante.toLowerCase().includes(texto)) ||
                    (e.email && e.email.toLowerCase().includes(texto))
                );
            }

            // Filtro Estado
            if (estado === 'activo') {
                resultados = resultados.filter(e => e.activo === true);
            } else if (estado === 'inactivo') {
                resultados = resultados.filter(e => e.activo === false);
            }

            // 4. Actualizar UI
            if (badgeTotal) badgeTotal.textContent = `${resultados.length} Resultados`;

            const contenedor = document.getElementById('tablaEstudiantes');
            if (contenedor) {
                contenedor.innerHTML = renderTablaEstudiantes(resultados);
            }
        }// finaliza filtrado por estudiante

        // Aplicar todos los filtros combinados
        async function aplicarFiltros() {
            const gradoId = document.getElementById('filtroGrado').value;
            const seccionId = document.getElementById('filtroSeccion').value;
            const textoFiltro = document.getElementById('filtroEstudiante').value.toLowerCase();

            let estudiantesFiltrados = [...app.data.estudiantes];

            // Filtrar por grado
            if (gradoId) {
                estudiantesFiltrados = estudiantesFiltrados.filter(e => e.grado_id === gradoId);
            }

            // Filtrar por sección (requiere consulta adicional)
            if (seccionId) {
                const { data: estudiantesEnSeccion } = await supabaseClient
                    .from('estudiante_cursos')
                    .select('estudiante_id')
                    .eq('seccion_id', seccionId);

                const idsEnSeccion = estudiantesEnSeccion?.map(es => es.estudiante_id) || [];
                estudiantesFiltrados = estudiantesFiltrados.filter(e => idsEnSeccion.includes(e.id));
            }

            // Filtrar por texto
            if (textoFiltro) {
                estudiantesFiltrados = estudiantesFiltrados.filter(e =>
                    e.nombre_completo.toLowerCase().includes(textoFiltro) ||
                    (e.codigo_estudiante && e.codigo_estudiante.toLowerCase().includes(textoFiltro)) ||
                    e.email.toLowerCase().includes(textoFiltro)
                );
            }

            // Actualizar la lista
            document.getElementById('listaEstudiantes').innerHTML = renderListaEstudiantes(estudiantesFiltrados);

            // Resetear checkboxes y contador
            deseleccionarTodos();
        }

        function seleccionarTodos() {
            const checkboxes = document.querySelectorAll('.check-estudiante');
            checkboxes.forEach(cb => cb.checked = true);
            document.getElementById('checkTodos').checked = true;
            actualizarContador();

        function renderListaEstudiantes(estudiantes) {
            if (!estudiantes || estudiantes.length === 0) {

        // ==========================================
        // SISTEMA ANTI-CONGELAMIENTO (HEARTBEAT)
        // ==========================================
        function iniciarSistemaAntiCongelamiento() {
            console.log('❤️ Iniciando sistema anti-congelamiento...');

            // 1. DETECTOR DE DESPERTAR (Cuando vuelves a la pestaña)
            document.addEventListener("visibilitychange", async () => {
                if (document.visibilityState === 'visible') {
                    console.log('👁️ Pestaña activa nuevamente. Verificando conexión...');

                    // Forzar verificación de sesión
                    const { data, error } = await supabaseClient.auth.getSession();

                    if (error || !data.session) {
                        console.warn('⚠️ Sesión perdida durante inactividad.');
                        // Opcional: Mostrar aviso o redirigir al login si es crítico
                        // renderLogin(); 
                    } else {
                        console.log('✅ Conexión restablecida correctamente.');
                    }
                }
            });

            // 2. LATIDO DEL CORAZÓN (Ping cada 4 minutos)
            // Evita que el navegador corte la conexión por inactividad
            setInterval(async () => {
                try {
                    // Hacemos una llamada ligera a Supabase para mantener el token vivo
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) {
                        console.log('💓 Heartbeat: Sesión activa');
                    }
                } catch (e) {
                    console.error('💓 Heartbeat falló:', e);
                }
            }, 240000); // 240,000 ms = 4 minutos
        }

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        async function init() {
            try {
                console.log('🚀 Inicializando aplicación...');

                // ✅ AGREGAR ESTA LÍNEA AQUÍ:
                iniciarSistemaAntiCongelamiento();

                const { data: { session } } = await supabaseClient.auth.getSession();

                if (session) {
                    console.log('🔐 Sesión existente encontrada');
                    const loaded = await loadUserProfile(session.user.id);
                    if (loaded) {
                        renderApp();
                    } else {
                        renderLogin();
                    }
                } else {
                    console.log('📝 No hay sesión activa, mostrando login');
                    renderLogin();
                }

                // Listener de cambios de autenticación
                supabaseClient.auth.onAuthStateChange(async (event, session) => {
                    console.log('🔔 Evento Auth:', event);

                    if (event === 'PASSWORD_RECOVERY') {
                        console.log('🔑 Modo recuperación de contraseña detectado');
                        showRecoveryPasswordModal();
                    } else if (event === 'SIGNED_IN' && session) {
                        const loaded = await loadUserProfile(session.user.id);
                        if (loaded) renderApp();
                    } else if (event === 'SIGNED_OUT') {
                        app.currentUser = null;
                        renderLogin();
                    }
                });

            } catch (error) {
                console.error('❌ Error de inicialización:', error);
                renderLogin();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
