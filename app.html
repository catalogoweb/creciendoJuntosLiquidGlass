<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeyaSchool - Plataforma Educativa</title>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>


    <style>
        .promedio-excelente {
            background: #4285f4;
            /* Azul Google */
            color: white;
        }

        .promedio-bueno {
            background: #fbbc04;
            /* Amarillo Google */
            color: white;
        }

        .promedio-regular {
            background: #34a853;
            /* Verde Google */
            color: white;
        }

        .promedio-bajo {
            background: #ea4335;
            /* Rojo Google */
            color: white;
        }

        :root {
            --facebook-blue: #1877f2;
            --facebook-blue-dark: #166fe5;
            --facebook-blue-light: #e7f3ff;
            --bg-primary: #f0f2f5;
            --bg-white: #ffffff;
            --text-primary: #050505;
            --text-secondary: #65676b;
            --border-color: #dddfe2;
            --success: #42b72a;
            --danger: #e4304d;
            --warning: #f7b928;
            --info: #17a2b8;
            --shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        .flex {
            display: flex;
        }

        .justify-between {
            justify-content: space-between;
        }

        .items-center {
            align-items: center;
        }

        .gap-2 {
            gap: 1rem;
        }

        .mt-1 {
            margin-top: 0.5rem;
        }

        .mt-2 {
            margin-top: 1rem;
        }

        .mb-2 {
            margin-bottom: 1rem;
        }

        .p-2 {
            padding: 1rem;
        }

        .navbar {
            background: var(--bg-white);
            box-shadow: var(--shadow);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--facebook-blue);
            text-decoration: none;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--facebook-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
        }

        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 2rem auto;
            gap: 1rem;
            padding: 0 1rem;
        }

        .sidebar {
            width: 250px;
            background: var(--bg-white);
            border-radius: var(--radius);
            padding: 1rem;
            height: fit-content;
            box-shadow: var(--shadow);
            position: sticky;
            top: 80px;
        }

        .sidebar-item {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 0.5rem;
        }

        .sidebar-item:hover {
            background: var(--bg-primary);
        }

        .sidebar-item.active {
            background: var(--facebook-blue-light);
            color: var(--facebook-blue);
            font-weight: 600;
        }

        .content {
            flex: 1;
            min-width: 0;
        }

        .card {
            background: var(--bg-white);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
        }

        .card-header {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--facebook-blue), var(--facebook-blue-dark));
            color: white;
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .curso-card {
            background: var(--bg-white);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
            border-left: 4px solid var(--facebook-blue);
        }

        .curso-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, .15);
        }

        .curso-disponible {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--info);
        }

        .actividad-item {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 0.5rem;
            border-left: 3px solid var(--facebook-blue);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--facebook-blue);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-primary {
            background: var(--facebook-blue);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--facebook-blue-dark);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .btn-info {
            background: var(--info);
            color: white;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-primary);
        }

            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);

        tbody tr:hover {

            top: 0;
            background: var(--facebook-blue);
            color: white;
            z-index: 10;
        }

        .gradebook-table th:first-child {
            position: sticky;
            left: 0;
            z-index: 11;
        }

        .gradebook-table td:first-child {
            position: sticky;
            left: 0;
            background: var(--bg-white);
            font-weight: 600;
        }

        .gradebook-table input {
            width: 60px;
            padding: 0.25rem;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .gradebook-table input:focus {
            outline: none;
            border-color: var(--facebook-blue);
            background: var(--facebook-blue-light);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;

        .modal-content {
            background: var(--bg-white);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.5rem;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
        }

        .close-modal:hover {
            color: var(--danger);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--facebook-blue), var(--facebook-blue-dark));
        }

        .login-box {
            background: var(--bg-white);
            padding: 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 400px;
            width: 90%;
        }

        .login-box h1 {
            text-align: center;
            color: var(--facebook-blue);
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .badge-primary {
            background: var(--facebook-blue-light);
            color: var(--facebook-blue);
        }

        .badge-success {
            background: #d4edda;
            color: var(--success);
        }

        .badge-danger {
            background: #f8d7da;
            color: var(--danger);
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-info {
            background: #d1ecf1;
            color: var(--info);
        }

        .alert {
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 1rem;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--facebook-blue);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--bg-white);
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 3000;
            animation: slideIn 0.3s;
            min-width: 300px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .nota-input {
            width: 80px;
            text-align: center;
        }

        .promedio-display {
            font-size: 1.5rem;
            font-weight: 700;
            padding: 1rem;
            border-radius: var(--radius);
            text-align: center;
            margin: 1rem 0;
        }

        .promedio-excelente {
            background: var(--success);
            color: white;
        }

        .promedio-bueno {
            background: var(--facebook-blue);
            color: white;
        }

        .promedio-regular {
            background: var(--warning);
            color: white;
        }

        .promedio-bajo {
            background: var(--danger);
            color: white;
        }

        .asignacion-card {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: var(--radius);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .estudiante-item {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .estudiante-item:last-child {
            border-bottom: none;
        }

        .estudiante-checkbox {
            margin-right: 1rem;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                position: static;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Estilos para importación de archivos */
        .drop-zone {
            border: 3px dashed var(--facebook-blue);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            text-align: center;
            background: var(--facebook-blue-light);
            cursor: pointer;
            transition: all 0.3s;
            margin: 1rem 0;
        }

        .drop-zone:hover {
            background: var(--bg-primary);
            border-color: var(--facebook-blue-dark);
        }

        .drop-zone.dragover {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .drop-zone-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .file-input-hidden {
            display: none;
        }

        .import-results {
            margin-top: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .import-row {
            padding: 0.5rem;
            margin: 0.25rem 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .import-row.success {
            background: #d4edda;
            border-left: 4px solid var(--success);
        }

        .import-row.error {
            background: #f8d7da;
            border-left: 4px solid var(--danger);
        }

        .import-row.warning {
            background: #fff3cd;
            border-left: 4px solid var(--warning);
        }

           MÓDULO DE MENSAJERÍA
        ========================================== */
        .msg-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mensajes-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 1rem;
            min-height: 500px;
        }

        @media (max-width: 768px) {
            .mensajes-layout {
                grid-template-columns: 1fr;
            }
        }

        .mensajes-panel {
            background: var(--bg-white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .mensajes-panel-header {
            padding: 1rem 1.25rem;
            font-weight: 700;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
        }

        .mensajes-tab {
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .mensajes-tab.active {
            background: var(--facebook-blue);
            color: white;
        }

        .mensajes-tab:hover:not(.active) {
            background: var(--border-color);
        }

        .mensajes-list {
            overflow-y: auto;
            flex: 1;
        }

        .mensajes-item {
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .mensajes-item:hover {
            background: var(--bg-primary);
        }

        .mensajes-item.activo {
            background: var(--facebook-blue-light);
            border-left: 3px solid var(--facebook-blue);
        }

        .mensajes-item.no-leido .msg-item-remitente {
            font-weight: 700;
            color: var(--text-primary);
        }

        .mensajes-item.no-leido .msg-item-asunto {
            font-weight: 700;
        }

        .msg-item-remitente {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .msg-item-asunto {
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-item-fecha {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .msg-punto-nuevo {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--facebook-blue);
            border-radius: 50%;
            margin-right: 4px;
            flex-shrink: 0;
        }

        .mensajes-detalle {
            background: var(--bg-white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .mensajes-detalle-vacio {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-secondary);
            font-size: 1rem;
            gap: 0.75rem;
            min-height: 400px;
        }

        .mensajes-detalle-vacio span {
            font-size: 3rem;
        }

        .msg-detalle-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .msg-detalle-asunto {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .msg-detalle-meta {
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .msg-detalle-cuerpo {
            background: var(--bg-primary);
            border-radius: var(--radius);
            padding: 1.25rem;
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;

        }

        .msg-detalle-acciones {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        /* Modal nuevo mensaje */
        .nuevo-msg-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>

        function emojiToDataURL(emoji, size = 64) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.font = `${size * 0.8}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, size / 2, size / 2);
            return canvas.toDataURL();
        }

        function getGradingInfo(score) {
            let faceIcon, starsHtml, description, bgColor, simpleStars;

            if (score >= 90) {
                // 90–100: Excelente	😄 + ⭐⭐⭐⭐⭐ brillantes
                faceIcon = '😄';
                starsHtml = '<span style="color:gold">⭐⭐⭐⭐⭐</span>';

                description = 'Has superado todas las metas.';
                bgColor = 'bg-yellow-500'; // Tailwind class mapping equivalent
                label = '¡Meta superada, eres imparable!';
                colorCode = '#FBBC04';
            } else if (score >= 80) {
                // 80–89: Bien	🙂 + ⭐⭐⭐⭐ brillantes
                faceIcon = '🙂';
                starsHtml = '<span style="color:gold">⭐⭐⭐⭐</span>';
                simpleStars = '⭐⭐⭐⭐';
                description = 'Sigue esforzándote.';
                bgColor = 'bg-green-500';
                label = '¡Logro increíble, mucho ánimo!';
                colorCode = '#34A853';
            } else if (score >= 70) {
                // 70–79: Bueno	😐 + ⭐⭐⭐ normales
                faceIcon = '😐';
                starsHtml = '⭐⭐⭐';
                simpleStars = '⭐⭐⭐';
                description = 'Hay cosas que puedes mejorar.';
                bgColor = 'bg-blue-500';
                label = '¡Excelente progreso, tú puedes!';
                colorCode = '#4285F4';
            } else if (score >= 60) {
                // 60–69: Regular	😕 + ⭐⭐ normales
                faceIcon = '😕';
                starsHtml = '⭐⭐';
                simpleStars = '⭐⭐';
                description = 'Necesitas más práctica en algunas áreas.';
                bgColor = 'bg-orange-500';
                label = '¡Sigue practicando sin parar!';
                colorCode = '#FFA726';
            } else {
                // < 60: Debe mejorar	😞 + ⭐ naranja o roja

                description = 'Pide apoyo en clase.';
                bgColor = 'bg-red-500';

            return { faceIcon, starsHtml, simpleStars, description, bgColor, label, colorCode };

        // ==========================================
        // CRUD GENÉRICO
        // ==========================================
        async function getData(table, filters = {}, select = '*') {
            try {
                let query = supabaseClient.from(table).select(select);
                Object.keys(filters).forEach(key => {
                    query = query.eq(key, filters[key]);
                });
                const { data, error } = await query;
                if (error) throw error;
                return data || [];
            } catch (error) {
                console.error(`Error obteniendo ${table}:`, error);
                return [];
            }
        }

        async function insertData(table, data) {
            try {
                const { data: result, error } = await supabaseClient
                    .from(table)
                    .insert(data)
                    .select();
                if (error) throw error;
                showNotification('Registro creado exitosamente', 'success');
                return result[0];
            } catch (error) {
                console.error('Error insertando:', error);
                showNotification('Error: ' + error.message, 'danger');
                return null;
            }
        }

        async function updateData(table, id, data) {
            try {

                    .from(table)

                if (error) throw error;
                showNotification('Registro actualizado exitosamente', 'success');
                return true;

                console.error('Error actualizando:', error);
                showNotification('Error: ' + error.message, 'danger');

            if (!confirm('¿Estás seguro de eliminar este registro?')) return false;
            try {
                const { error } = await supabaseClient
                    .from(table)
                    .delete()
                    .eq('id', id);
                if (error) throw error;
                showNotification('Registro eliminado exitosamente', 'success');
                return true;
            } catch (error) {
                console.error('Error eliminando:', error);
                showNotification('Error: ' + error.message, 'danger');

        async function loadEstudiantes(soloActivos = true) {
            try {
                console.log('🔄 Cargando estudiantes...', soloActivos ? '(solo activos)' : '(todos)');

                let query = supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('rol', 'estudiante');

                // ✅ Solo filtrar por activo si se solicita
                if (soloActivos) {
                    query = query.eq('activo', true);
                }

                const { data, error } = await query.order('created_at', { ascending: false });

                if (error) {
                    console.error('❌ Error cargando estudiantes:', error);
                    app.data.estudiantes = [];
                    return [];
                }

                app.data.estudiantes = data || [];
                console.log(`✅ ${app.data.estudiantes.length} estudiantes cargados`);

                // Cargar nombres de grados
                if (app.data.estudiantes.length > 0) {
                    const gradoIds = [...new Set(app.data.estudiantes
                        .map(e => e.grado_id)
                        .filter(id => id))];

                    if (gradoIds.length > 0) {
                        const { data: gradosData } = await supabaseClient
                            .from('grados')
                            .select('id, nombre')
                            .in('id', gradoIds);

                        if (gradosData) {
                            const gradosMap = {};
                            gradosData.forEach(g => {
                                gradosMap[g.id] = g.nombre;
                            });

                            app.data.estudiantes = app.data.estudiantes.map(e => ({
                                ...e,
                                grado_nombre: e.grado_id ? gradosMap[e.grado_id] : null
                            }));
                        }
                    }
                }

                return app.data.estudiantes;

            } catch (error) {
                console.error('❌ Error en loadEstudiantes:', error);
                app.data.estudiantes = [];
                return [];
            }
        }

        // ==========================================
        // FUNCIÓN createEstudiante (CORREGIDA - SINCRONIZADA)
        // ==========================================
        async function createEstudiante(formData) {
            try {
                const email = (formData.get('email') || '').trim().toLowerCase();
                const password = (formData.get('password') || '');
                const nombreCompleto = (formData.get('nombre_completo') || '').trim();
                const codigoEstudiante = (formData.get('codigo_estudiante') || '').trim();
                const gradoId = formData.get('grado_id') || null;
                const seccionId = formData.get('seccion_id') || null;

                if (!email || !password || !nombreCompleto) {
                    showNotification('Por favor completa nombre, email y contraseña', 'danger');
                    return false;
                }

                if (password.length < 6) {
                    showNotification('La contraseña debe tener al menos 6 caracteres', 'danger');
                    return false;
                }

                console.log('📝 Creando/Sincronizando estudiante:', email);

                // 1) Crear usuario en auth con un cliente temporal para no cerrar sesión del admin
                const tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: false,
                        autoRefreshToken: false,
                        detectSessionInUrl: false
                    }
                });

                const { data: authData, error: authError } = await tempClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            nombre_completo: nombreCompleto,
                            rol: 'estudiante'
                        }
                    }
                });

                if (authError) {
                    if (String(authError.message).toLowerCase().includes('already')) {
                        console.warn('⚠️ Usuario ya existe en auth. Se procederá a sincronizar el perfil.');
                    } else {
                        throw new Error(authError.message);
                    }
                }

                // 2) Obtener el ID del usuario
                const { data: userData, error: userError } = await supabaseClient.rpc('get_user_id_by_email', { p_email: email });

                if (userError || !userData) {
                    console.error('❌ Error obteniendo ID de usuario:', userError);
                    throw new Error('No se pudo encontrar el usuario en el sistema.');
                }

                const userId = userData;

                // 3) Upsert del perfil
                const { error: perfilError } = await supabaseClient
                    .from('profiles')
                    .upsert(
                        {
                            id: userId,
                            email,
                            nombre_completo: nombreCompleto,
                            codigo_estudiante: codigoEstudiante,
                            grado_id: gradoId,
                            seccion_id: seccionId,
                            rol: 'estudiante',
                            activo: true
                        },
                        { onConflict: 'id' }
                    );

                if (perfilError) {
                    console.error('❌ Error en upsert de perfil:', perfilError);
                    throw new Error('No se pudo crear/actualizar el perfil: ' + perfilError.message);
                }

                console.log('✅ Estudiante sincronizado exitosamente.');
                await loadEstudiantes(false);
                showNotification('Estudiante procesado exitosamente', 'success');

                return true;

            } catch (error) {
                console.error('❌ Error en createEstudiante:', error);
                showNotification('Error al crear estudiante: ' + error.message, 'danger');
                return false;
            }
        }

        async function cambiarPasswordEstudiante(userId, userEmail, nuevaPassword) {
            try {
                if (!nuevaPassword || nuevaPassword.length < 6) return true;

                console.log('🔑 Intentando cambio de contraseña (Método Reparación) para:', userEmail);

                // Obtenemos la sesión justo antes de enviar, igual que en el script de reparación
                const { data: { session } } = await supabaseClient.auth.getSession();

                if (!session) {
                    throw new Error('Sesión de administrador no encontrada. Por favor, cierra sesión y vuelve a entrar.');
                }

                const response = await fetch(RAPID_ACTION_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${session.access_token}`,
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: userId,
                        newPassword: nuevaPassword
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✅ Contraseña actualizada correctamente', 'success');
                    return true;
                } else {
                    console.error('❌ Error devuelto por el servidor:', result);
                    const msg = result.error || result.message || 'Error desconocido';

                    if (msg.includes('algorithm ES256')) {
                        throw new Error('Incompatibilidad de seguridad (ES256). Tu servidor de Supabase es antiguo y no reconoce tu sesión actual. Por favor, contacta a soporte técnico para actualizar la Edge Function.');
                    }

                    throw new Error(msg);
                }
            } catch (error) {
                console.error('❌ Error en cambio de contraseña:', error);
                showNotification('Error: ' + error.message, 'danger');
                return false;
            }
        }

            );

            if (!passwordPorDefecto || passwordPorDefecto.length < 6) {

                return;
            }

            if (!confirm(`¿Reparar ${app.data.estudiantes.length} estudiantes con la contraseña "${passwordPorDefecto}"?`)) {
                return;
            }

            const modal = openModal(`
                <div class="modal-header">
                    <h2>🔧 Reparando Estudiantes</h2>
                </div>
                <div id="repairProgress">
                    <div class="alert alert-info">
                        <strong>⏳ Procesando...</strong>
                        <div class="spinner" style="margin: 1rem auto;"></div>
                    </div>
                </div>
                <div id="repairResults" class="hidden"></div>
            `);

            const progressDiv = document.getElementById('repairProgress');
            const resultsDiv = document.getElementById('repairResults');

            let reparados = 0;
            let sincronizados = 0;
            let creados = 0;
            let errores = 0;

            for (let i = 0; i < app.data.estudiantes.length; i++) {
                const estudiante = app.data.estudiantes[i];

                progressDiv.innerHTML = `
                    <div class="alert alert-info">
                        <strong>⏳ Procesando ${i + 1} de ${app.data.estudiantes.length}</strong><br>
                        ${estudiante.nombre_completo} (${estudiante.email})
                    </div>
                `;

                try {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) throw new Error('Sesión perdida');

                    const url = RAPID_ACTION_URL;

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${session.access_token}`,
                            'apikey': SUPABASE_ANON_KEY,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            userId: estudiante.id,
                            newPassword: passwordPorDefecto
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        reparados++;
                        if (result.synced) sincronizados++;
                        if (result.created) creados++;
                        console.log('✅', estudiante.email);
                    } else {
                        errores++;
                        console.error('❌', estudiante.email, ':', result.error);
                    }

                } catch (error) {
                    errores++;
                    console.error('❌', estudiante.email, ':', error);
                }

                await new Promise(resolve => setTimeout(resolve, 500));
            }

            progressDiv.classList.add('hidden');
            resultsDiv.classList.remove('hidden');
            resultsDiv.innerHTML = `

                    <h3>✅ Proceso Completado</h3>

                        <li><strong>${creados}</strong> usuarios creados en auth</li>
                        <li><strong>${sincronizados}</strong> usuarios sincronizados</li>

        // ==========================================
        // FUNCIÓN createMaestro CORREGIDA
        // ==========================================
        // ==========================================
        // FUNCIÓN createMaestro (robusta y definitiva)
        // ==========================================
        // ==========================================
        // FUNCIÓN createMaestro (VERSIÓN FINAL CORREGIDA)
        // - Corregida la errata que causaba el bloqueo.
        // ==========================================
        // ==========================================
        // FUNCIÓN createMaestro (CORREGIDA - SINCRONIZADA)
        // ==========================================
        async function createMaestro(formData) {
            try {
                const email = (formData.get('email') || '').trim();
                const password = (formData.get('password') || '');
                const nombreCompleto = (formData.get('nombre_completo') || '').trim();
                const telefono = ((formData.get('telefono') || '').trim()) || null;

                if (!email || !password || !nombreCompleto) {
                    showNotification('Por favor completa nombre, email y contraseña', 'danger');
                    return false;
                }

                console.log('📝 Creando maestro:', email);

                // 1) Crear usuario en auth con un cliente temporal para no cerrar sesión del admin
                const tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: false,
                        autoRefreshToken: false,
                        detectSessionInUrl: false
                    }
                });

                const { data: authData, error: authError } = await tempClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            nombre_completo: nombreCompleto,
                            rol: 'maestro'
                        }
                    }
                });

                if (authError) {
                    // Si el usuario ya existe, no es un error fatal.
                    if (String(authError.message).toLowerCase().includes('already')) {
                        console.warn('⚠️ Usuario ya existe en auth. Se procederá a actualizar el perfil.');
                    } else {
                        // Otro error de signUp sí es fatal.
                        throw new Error(authError.message);
                    }
                }

                // 2) Obtener el ID del usuario, ya sea recién creado o existente.
                // Usamos rpc para llamar a una función que obtiene el ID de forma segura.
                const { data: userData, error: userError } = await supabaseClient.rpc('get_user_id_by_email', { p_email: email });

                if (userError || !userData) {
                    console.error('❌ Error obteniendo ID de usuario:', userError);
                    throw new Error('No se pudo encontrar el usuario en el sistema.');
                }

                const userId = userData;
                console.log('✅ ID de usuario obtenido:', userId);

                // 3) Crear/actualizar el perfil en "profiles" AHORA que sabemos que el usuario existe en auth.
                const { error: perfilError } = await supabaseClient
                    .from('profiles')
                    .upsert(
                        {
                            id: userId,
                            email,
                            nombre_completo: nombreCompleto,
                            rol: 'maestro',
                            telefono,
                            activo: true
                        },
                        { onConflict: 'id' }
                    );

                if (perfilError) {
                    console.error('❌ Error en upsert de perfil:', perfilError);
                    throw new Error('No se pudo crear/actualizar el perfil: ' + perfilError.message);
                }

                console.log('✅ Perfil del maestro creado/actualizado con éxito.');

                // 4) Refrescar la interfaz de usuario.
                await loadMaestros();
                showNotification('Maestro creado exitosamente', 'success');
                await renderView('maestros');
                return true;

            } catch (error) {
                console.error('❌ Error completo en createMaestro:', error);
                showNotification('Error al crear maestro: ' + error.message, 'danger');
                return false;
            }
        }

        async function inscribirEstudiante(estudianteId, cursoId, seccionId = null) {
            const año = new Date().getFullYear();

            // Verificar si ya está inscrito
            // Usamos maybeSingle para evitar error JSON si no encuentra nada
            const { data: existing, error } = await supabaseClient
                .from('estudiante_cursos')
                .select('id')
                .eq('estudiante_id', estudianteId)
                .eq('curso_id', cursoId)
                .eq('año', año)
                .maybeSingle();

            if (error) {
                console.error("Error verificando inscripción:", error);
                return null;
            }

            if (existing) {
                console.log('Estudiante ya inscrito en este curso');
                return null;
            }

            // Construir payload asegurando que seccionId no sea string vacío
            const payload = {
                estudiante_id: estudianteId,
                curso_id: cursoId,
                año: año,
                activo: true
            };

            if (seccionId && seccionId !== "") {
                payload.seccion_id = seccionId;
            }

            return await insertData('estudiante_cursos', payload);
        }

        //Inscribir grado completo
        async function inscribirGradoCompleto(gradoId, cursoId, seccionId = null) {
            console.log(`🔄 Procesando inscripción masiva: Grado ${gradoId} -> Sección ${seccionId || 'Todas'}`);

            // 1. Construir la consulta para buscar estudiantes
            let query = supabaseClient
                .from('profiles')
                .select('id, nombre_completo')
                .eq('rol', 'estudiante')
                .eq('grado_id', gradoId)
                .eq('activo', true);

            if (seccionId && seccionId !== "") {
                query = query.eq('seccion_id', seccionId);
            }

            const { data: estudiantes, error } = await query;

            if (error) {
                console.error('Error buscando estudiantes:', error);
                showNotification('Error al buscar estudiantes', 'danger');
                return 0;
            }

            if (!estudiantes || estudiantes.length === 0) {
                showNotification('⚠️ No se encontraron estudiantes en este grado/sección para inscribir.', 'warning');
                return 0;
            }

            console.log(`✅ Se encontraron ${estudiantes.length} estudiantes para inscribir.`);

            let inscritos = 0;

            // 2. Inscribir a cada estudiante encontrado
            for (const estudiante of estudiantes) {
                const result = await inscribirEstudiante(estudiante.id, cursoId, seccionId);
                if (result) inscritos++;
            }

            showNotification(`${inscritos} estudiantes inscritos exitosamente.`, 'success');
            return inscritos;
        }

        // ==========================================
        // CÁLCULO DE PROMEDIOS OPTIMIZADO
        // ==========================================

        // ✅ Variables de caché (DECLARADAS UNA SOLA VEZ)
        let cachePromedios = null;
        let cacheEstudianteId = null;


        // CÁLCULO DE PROMEDIOS (SISTEMA PONDERADO 0-100%)
        // ==========================================
        async function calcularTodosPromedios(estudianteId, cursoIds) {
            try {
                // Obtener notas y el valor de la actividad
                const { data: todasNotas } = await supabaseClient
                    .from('notas')
                    .select(`
                        nota,
                        actividades!inner (
                            curso_id,
                            unidad_id,
                            puntaje_maximo
                        )
                    `)
                    .eq('estudiante_id', estudianteId);

                const acumuladoPorCurso = {}; // Suma de puntos netos
                const acumuladoPorUnidad = {};

                const maximoPorCurso = {}; // Suma de puntaje_maximo (para running percentage)
                const maximoPorUnidad = {};

                if (todasNotas) {
                    todasNotas.forEach(n => {
                        const act = n.actividades;
                        const notaIngresada = parseFloat(n.nota) || 0;
                        const valorActividad = parseFloat(act.puntaje_maximo) || 0;

                        // CALCULO PONDERADO: (100 / 100) * 15 = 15 pts netos
                        const puntosNetos = (notaIngresada / 100) * valorActividad;

                        // Sumar al Curso
                        if (!acumuladoPorCurso[act.curso_id]) acumuladoPorCurso[act.curso_id] = 0;
                        acumuladoPorCurso[act.curso_id] += puntosNetos;

                        if (!maximoPorCurso[act.curso_id]) maximoPorCurso[act.curso_id] = 0;
                        maximoPorCurso[act.curso_id] += valorActividad;

                        // Sumar a la Unidad
                        const keyUnidad = `${act.curso_id}_${act.unidad_id}`;
                        if (!acumuladoPorUnidad[keyUnidad]) acumuladoPorUnidad[keyUnidad] = 0;
                        acumuladoPorUnidad[keyUnidad] += puntosNetos;

                        if (!maximoPorUnidad[keyUnidad]) maximoPorUnidad[keyUnidad] = 0;
                        maximoPorUnidad[keyUnidad] += valorActividad;
                    });
                }

                // Formatear a 2 decimales
                const promediosCursoFinal = {};
                const promediosUnidadFinal = {};

                // Guardamos tabien los maximos en cache
                const maximosCursoFinal = {};
                const maximosUnidadFinal = {};

                Object.keys(acumuladoPorCurso).forEach(k => {
                    promediosCursoFinal[k] = acumuladoPorCurso[k].toFixed(2);
                    maximosCursoFinal[k] = maximoPorCurso[k].toFixed(2);
                });
                Object.keys(acumuladoPorUnidad).forEach(k => {
                    promediosUnidadFinal[k] = acumuladoPorUnidad[k].toFixed(2);
                    maximosUnidadFinal[k] = maximoPorUnidad[k].toFixed(2);
                });

                return {
                    porCurso: promediosCursoFinal,
                    porUnidad: promediosUnidadFinal,
                    maxPorCurso: maximosCursoFinal,
                    maxPorUnidad: maximosUnidadFinal
                };

            } catch (error) {
                console.error('Error cálculo:', error);
                return { porCurso: {}, porUnidad: {} };
            }
        }// finaliza el calculo

        // ✅ CALCULO DE PROMEDIOS (CENTRALIZADO Y OPTIMIZADO)
        async function calcularPromedioUnidad(estudianteId, cursoId, unidadId) {
            if (!cachePromedios || cacheEstudianteId !== estudianteId) {
                const cursoIds = app.data.misCursos?.map(mc => mc.curso_id) || [cursoId];
                cachePromedios = await calcularTodosPromedios(estudianteId, cursoIds);
                cacheEstudianteId = estudianteId;
            }
            const key = `${cursoId}_${unidadId}`;
            const puntos = parseFloat(cachePromedios.porUnidad[key] || 0);
            const max = parseFloat(cachePromedios.maxPorUnidad[key] || 0);
            return max > 0 ? ((puntos / max) * 100).toFixed(2) : '0.00';
        }

        async function calcularPromedioCurso(estudianteId, cursoId) {
            if (!cachePromedios || cacheEstudianteId !== estudianteId) {
                const cursoIds = app.data.misCursos?.map(mc => mc.curso_id) || [cursoId];
                cachePromedios = await calcularTodosPromedios(estudianteId, cursoIds);
                cacheEstudianteId = estudianteId;
            }
            const puntos = parseFloat(cachePromedios.porCurso[cursoId] || 0);
            const max = parseFloat(cachePromedios.maxPorCurso[cursoId] || 0);
            return max > 0 ? ((puntos / max) * 100).toFixed(2) : '0.00';
        }

        function limpiarCachePromedios() {
            cachePromedios = null;
            cacheEstudianteId = null;
        }

        // ✅ NUEVO: Función para obtener datos completos (Puntos y Máximo)
        async function obtenerDatosPromedio(estudianteId, cursoId, unidadId = null) {
            // Si no hay caché o es otro estudiante, calcular todo
            if (!cachePromedios || cacheEstudianteId !== estudianteId) {
                const cursoIds = app.data.misCursos?.map(mc => mc.curso_id) || [cursoId];
                cachePromedios = await calcularTodosPromedios(estudianteId, cursoIds);
                cacheEstudianteId = estudianteId;
            }

            if (unidadId) {
                const key = `${cursoId}_${unidadId}`;
                return {
                    puntos: parseFloat(cachePromedios.porUnidad[key] || 0),
                    max: parseFloat(cachePromedios.maxPorUnidad[key] || 0)
                };
            } else {
                return {
                    puntos: parseFloat(cachePromedios.porCurso[cursoId] || 0),
                    max: parseFloat(cachePromedios.maxPorCurso[cursoId] || 0)
                };
            }
        }

                    const nombreModificador = n.profiles?.nombre_completo || 'Sistema';

            const backAction = esSupervision
                ? "renderView('supervision')"
                : `verDetallesCurso('${cursoId}', '${gradoId}', '${seccionId}')`;

            // ✅ FILTRO POR UNIDAD: Obtener unidades que tienen actividades en este curso/sección
            await loadUnidades();
            const unidadesConActividades = app.data.unidades.filter(u =>
                app.data.actividades.some(a => a.unidad_id === u.id)
            );

            // Leer unidad actualmente seleccionada (guardada en variable global)
            const unidadFiltroActual = window._libroUnidadFiltro || '';

            // Filtrar actividades por la unidad seleccionada
            const actividadesFiltradas = unidadFiltroActual
                ? app.data.actividades.filter(a => a.unidad_id === unidadFiltroActual)
                : app.data.actividades;

            content.innerHTML = `

                            <button class="btn btn-secondary btn-sm" onclick="${backAction}">← Volver</button>
                        </div>
                    </div>
                    
                    <div class="alert alert-info" style="font-size: 0.9rem;">
                        <strong>ℹ️ Sistema de Calificación:</strong> Ingresa la nota de <strong>0 a 100</strong>. 
                        El sistema calculará automáticamente los puntos netos según el valor de cada actividad.
                    </div>

                    <!-- ✅ SELECTOR DE UNIDAD -->
                    <div style="background: var(--bg-primary); padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                        <label style="font-weight: 600; white-space: nowrap;">📖 Filtrar por Unidad:</label>

        //ACTUALIZAR MODAL DE CREAR UNIDAD (OPCIONAL - MEJORA)
        function showCreateUnidadModal() {
            const añoActual = new Date().getFullYear();
            const mesActual = new Date().getMonth() + 1;

            // Sugerir fechas según el mes actual
            let fechaInicioSugerida = `${añoActual}-${String(mesActual).padStart(2, '0')}-01`;
            let fechaFinSugerida = `${añoActual}-${String(mesActual + 2).padStart(2, '0')}-01`;

            const modal = openModal(`
                <div class="modal-header">
                    <h2>📅 Crear Nueva Unidad</h2>
                    <button class="close-modal" onclick="this.closest('.modal').remove()">×</button>
                </div>
                <form id="createUnidadForm">
                    <div class="form-group">
                        <label class="form-label">Número de Unidad *</label>
                        <input type="number" class="form-input" name="numero" 
                               value="${app.data.unidades.length + 1}" 
                               min="1" max="10" required>
                        <small style="color: var(--text-secondary);">
                            Número que identifica la unidad (1-10)
                        </small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nombre de la Unidad *</label>
                        <input type="text" class="form-input" name="nombre" 
                               placeholder="Ej: Primera Unidad, Primer Bimestre" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Fecha de Inicio *</label>
                        <input type="date" class="form-input" name="fecha_inicio" 
                               value="${fechaInicioSugerida}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Fecha de Fin *</label>
                        <input type="date" class="form-input" name="fecha_fin" 
                               value="${fechaFinSugerida}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Año Académico *</label>
                        <input type="number" class="form-input" name="año" 
                               value="${añoActual}" min="2020" max="2099" required>
                    </div>

                    <div class="alert alert-info">
                        <strong>💡 Sugerencia:</strong> Las unidades suelen tener una duración 
                        de 6-8 semanas (aproximadamente 1.5-2 meses).
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">✅ Crear Unidad</button>
                        <button type="button" class="btn btn-secondary" onclick="this.closest('.modal').remove()">
                            Cancelar
                        </button>
                    </div>
                </form>
            `);

            document.getElementById('createUnidadForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);

                // Validar fechas
                const fechaInicio = new Date(formData.get('fecha_inicio'));
                const fechaFin = new Date(formData.get('fecha_fin'));

                if (fechaFin <= fechaInicio) {
                    showNotification('La fecha de fin debe ser posterior a la fecha de inicio', 'danger');
                    return;
                }

                // Validar que el número no esté duplicado para el mismo año
                const numero = parseInt(formData.get('numero'));
                const año = parseInt(formData.get('año'));

                const duplicada = app.data.unidades.find(u =>
                    u.numero === numero && u.año === año
                );

                if (duplicada) {
                    const confirmar = confirm(
                        `Ya existe la Unidad ${numero} para el año ${año}.\n\n` +
                        `¿Deseas crear otra unidad con el mismo número?`
                    );
                    if (!confirmar) return;
                }

                // Deshabilitar botón
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = '⏳ Creando...';

                const unidad = await createUnidad(formData);

                if (unidad) {
                    closeModal(modal);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '✅ Crear Unidad';
                }
            });
        }

        async function renderView(viewName) {
            app.currentView = viewName;
            const content = document.getElementById('mainContent');
            if (!content) {
                console.error('❌ No se encontró el contenedor mainContent');
                return;
            }

            // Actualizar sidebar
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) {
                sidebar.outerHTML = renderSidebar();
            }

            // Mostrar loading
            content.innerHTML = showLoading();

            // Limpiar caché de promedios al cambiar de vista
            limpiarCachePromedios();

            let html = '';

            try {
                console.log('🔄 Renderizando vista:', viewName);

                // ✅ AGREGAR TIMEOUT DE 10 SEGUNDOS
                const timeoutPromise = new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('Timeout: La vista tardó más de 10 segundos en cargar')), 10000)
                );

                const renderPromise = (async () => {
                    switch (viewName) {
                        case 'dashboard':
                            return await renderDashboard();
                        case 'cursos':
                            return await renderCursos();
                        case 'estudiantes':
                            return await renderEstudiantes();
                        case 'maestros':
                            return await renderMaestros();
                        case 'grados':
                            return await renderGrados();
                        case 'unidades':
                            return await renderUnidades();
                        case 'asignaciones':
                            return await renderAsignaciones();
                        case 'inscripciones':
                            return await renderInscripciones();
                        case 'asignarme-cursos':
                            return await renderAsignarmeCursos();
                        case 'mis-cursos':
                            return await renderMisCursosView();
                        case 'mis-notas':
                            return await renderMisNotas();
                        case 'boletas':
                            return await renderBoletasEstudiantes();
                        case 'reporte-asistencia':
                            return await renderReporteAsistencia();
                        case 'mis-asistencias':
                            return await renderMisAsistencias();
                        // ✅ NUEVO CASO PARA COORDINADOR
                        case 'supervision':
                            return await renderSupervisionCursos();

                        case 'backup-notas':
                            return await renderBackupNotasView();

                        case 'configuracion':
                            return await renderConfiguracion();

                        case 'mensajes':
                            return await renderMensajes();

                        default:
                            return '<div class="card"><p>Vista "' + viewName + '" en desarrollo...</p></div>';
                    }
                })();

                // Race entre el render y el timeout
                html = await Promise.race([renderPromise, timeoutPromise]);

                console.log('✅ Vista renderizada exitosamente:', viewName);

            } catch (error) {
                console.error('❌ Error renderizando vista "' + viewName + '":', error);
                html = '<div class="card">' +
                    '<div class="alert alert-danger">' +
                    '<strong>❌ Error al cargar la vista</strong><br>' +
                    'Vista: ' + viewName + '<br>' +
                    'Error: ' + error.message + '<br><br>' +
                    '<button class="btn btn-primary" onclick="changeView(\'dashboard\')">🏠 Ir al Dashboard</button> ' +
                    '<button class="btn btn-secondary" onclick="location.reload()">🔄 Recargar Página</button>' +
                    '</div>' +
                    '</div>';
            }

            // SIEMPRE actualizar el contenido
            content.innerHTML = html;
            console.log('📄 Contenido actualizado para vista:', viewName);
        }

        function filtrarTablaSupervision() {
            const input = document.getElementById('searchCursoCoord');
            const filter = input.value.toLowerCase();
            const table = document.getElementById('tablaSupervision');
            const tr = table.getElementsByTagName('tr');

            for (let i = 1; i < tr.length; i++) {
                const tdText = tr[i].innerText.toLowerCase();
                if (tdText.indexOf(filter) > -1) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
